<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15212b">
<meta name="description" content="Offline practice for STAT/DATA 1810 midterm 2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ME2 Drill">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ME2 Drill Bank · STAT/DATA 1810</title>
<style>
:root{
  --ink:#15212b; --ink2:#4a5b69; --paper:#e8edf1; --card:#ffffff; --line:#cfd8df;
  --blue:#1f5f8b; --teal:#0f8b8d; --red:#c0392b; --amber:#9a6a00; --code:#0e1a24; --codefg:#d9e6ef;
  --okbg:#e3f4f3; --badbg:#fbe9e7;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.45}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:14px 22px;background:var(--ink);color:#fff}
header.top h1{margin:0;font-size:1.15rem;font-weight:700;letter-spacing:.01em}
header.top .sub{color:#aebdca;font-size:.9rem}
header.top .stats{margin-left:auto;display:flex;gap:18px;font-variant-numeric:tabular-nums;font-size:.92rem}
header.top .stats b{font-size:1.1rem}
.wrap{display:grid;grid-template-columns:300px 1fr;gap:20px;max-width:1280px;margin:0 auto;padding:20px}
@media (max-width:900px){.wrap{grid-template-columns:1fr}}
aside{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;align-self:start;position:sticky;top:12px}
@media (max-width:900px){aside{position:static}}
aside h2{font-size:.95rem;margin:0 0 8px}
.modes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.modes button{flex:1 1 auto;padding:7px 10px;border:1px solid var(--line);background:#f5f8fa;border-radius:4px;cursor:pointer;font-size:.88rem}
.modes button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.topic{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:6px 4px;border-top:1px solid #edf1f4;font-size:.9rem}
.topic label{cursor:pointer}
.topic .bar{grid-column:2 / 4;height:5px;background:#e3e9ee;border-radius:3px;overflow:hidden}
.topic .bar i{display:block;height:100%;background:var(--teal)}
.topic .n{color:var(--ink2);font-size:.82rem;font-variant-numeric:tabular-nums}
.filters{margin:12px 0 4px;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.filters select{padding:6px;border:1px solid var(--line);border-radius:4px;background:#fff}
.mini{display:flex;gap:6px;margin-top:10px}
.mini button{flex:1;padding:6px 8px;border:1px solid var(--line);background:#fff;border-radius:4px;cursor:pointer;font-size:.82rem}
main{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:22px 24px}
.meta{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;color:var(--ink2);font-size:.85rem;margin-bottom:12px}
.meta .tag{border:1px solid var(--line);border-radius:3px;padding:1px 7px;background:#f5f8fa}
.prompt{font-family:Georgia,"Times New Roman",serif;font-size:1.15rem;margin:0 0 14px;white-space:pre-wrap}
pre.code{background:var(--code);color:var(--codefg);padding:14px 16px;border-radius:5px;overflow:auto;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.88rem;line-height:1.5;margin:0 0 16px;tab-size:2}
.opts{display:flex;flex-direction:column;gap:8px;margin:0 0 16px;padding:0;list-style:none}
.opt{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;width:100%;text-align:left;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:5px;cursor:pointer;font-size:.98rem}
.opt:hover{border-color:var(--blue)}
.opt .k{font-weight:700;color:var(--blue);font-family:ui-monospace,Menlo,Consolas,monospace}
.opt .t{white-space:pre-wrap;overflow-wrap:anywhere}
.opt.sel{border-color:var(--blue);background:#eef5fa}
.opt.good{border-color:var(--teal);background:var(--okbg)}
.opt.bad{border-color:var(--red);background:var(--badbg)}
.opt.miss{border-color:var(--teal);border-style:dashed}
.opt[disabled]{cursor:default}
.inputs{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-bottom:16px}
.inputs label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--ink2)}
.inputs input{width:130px;padding:9px 10px;border:1px solid var(--line);border-radius:5px;font-size:1.05rem;font-variant-numeric:tabular-nums}
.inputs .x{font-size:1.2rem;padding-bottom:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{padding:9px 18px;border-radius:5px;border:1px solid var(--blue);background:var(--blue);color:#fff;cursor:pointer;font-weight:600}
.btn.alt{background:#fff;color:var(--blue)}
.btn[disabled]{opacity:.5;cursor:default}
.fb{margin-top:16px;padding:12px 14px;border-radius:5px;border-left:5px solid var(--teal);background:var(--okbg)}
.fb.no{border-left-color:var(--red);background:var(--badbg)}
.fb b.v{display:block;margin-bottom:4px}
.fb p{margin:0;white-space:pre-wrap}
.hint{color:var(--ink2);font-size:.85rem;margin-top:10px}
.grid{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 14px}
.grid button{width:34px;height:30px;border:1px solid var(--line);background:#fff;border-radius:4px;cursor:pointer;font-size:.78rem;font-variant-numeric:tabular-nums}
.grid button.cur{border-color:var(--blue);outline:2px solid var(--blue)}
.grid button.done{background:#dbe8f1}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.low{color:var(--red)}
.res h2{margin:0 0 6px}
.res table{border-collapse:collapse;width:100%;margin:12px 0;font-size:.92rem}
.res th,.res td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.res .miss-item{border-top:1px solid var(--line);padding:12px 0}
.home{max-width:70ch}
.home h2{margin-top:0}
.home p{margin:.5em 0}
#tp-toggle{display:none;width:100%;padding:11px;border:1px solid var(--line);background:#f5f8fa;border-radius:5px;font-weight:600;cursor:pointer}
.inputs input{font-size:16px}
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
header.top{padding-top:calc(14px + env(safe-area-inset-top))}
@media (max-width:900px){
  #tp-toggle{display:block;margin-top:8px}
  #panel{display:none;margin-top:10px}
  aside.open #panel{display:block}
  header.top{padding:calc(10px + env(safe-area-inset-top)) 14px 10px;gap:6px 16px}
  header.top .stats{margin-left:0;width:100%;justify-content:space-between;font-size:.8rem;gap:8px}
  .wrap{padding:10px;gap:10px}
  .card{padding:16px 14px}
  .prompt{font-size:1.05rem}
  pre.code{font-size:.76rem;padding:12px}
  .opt{min-height:52px;padding:12px}
  .btn{flex:1 1 0;padding:14px 12px;font-size:1rem}
  .row.actions{position:sticky;bottom:0;background:linear-gradient(rgba(255,255,255,0),#fff 28%);padding:14px 0 calc(10px + env(safe-area-inset-bottom));margin-top:4px}
  .grid button{width:38px;height:36px}
}
textarea.try{width:100%;min-height:120px;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:5px;margin-bottom:14px;resize:vertical}
.fb.neutral{border-left-color:var(--blue);background:#eef5fa}
pre.ans{white-space:pre-wrap;overflow:auto;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.86rem;line-height:1.5;margin:6px 0 10px;background:rgba(255,255,255,.7);padding:10px 12px;border-radius:4px}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 5px;background:#f5f8fa;font-size:.85em}
</style>
</head>
<body>
<header class="top">
  <div><h1>ME2 drill bank</h1><div class="sub">STAT/DATA 1810 · midterm 2 · weeks 1 to 8, emphasis 5 to 8</div></div>
  <div class="stats" id="stats"></div>
</header>
<div class="wrap">
  <aside>
    <div class="modes" role="group" aria-label="Mode">
      <button id="m-practice" aria-pressed="true">Practice</button>
      <button id="m-mock" aria-pressed="false">Mock exam</button>
      <button id="m-missed" aria-pressed="false">Missed</button>
    </div>
    <button id="tp-toggle" type="button" aria-expanded="false">Topics and filters</button>
    <div id="panel">
    <h2>Topics</h2>
    <div id="topics"></div>
    <div class="mini"><button id="t-all">All</button><button id="t-none">None</button></div>
    <div class="filters">
      <label>Show <select id="f-seen"><option value="all">all questions</option><option value="new">unanswered only</option><option value="wrong">last answer wrong</option></select></label>
      <label>Difficulty <select id="f-d"><option value="0">any</option><option value="3">hard only</option></select></label>
    </div>
    <div class="mini"><button id="reset">Reset progress</button></div>
    </div>
  </aside>
  <main id="main"></main>
</div>
<script>
const BANK = [{"id": "verbs01", "topic": "verbs", "type": "multi", "prompt": "Which of these can change the NUMBER OF ROWS in a table? Select all that apply.", "code": null, "opts": ["select()", "filter()", "mutate()", "count()", "arrange()", "distinct()"], "ans": [1, 3, 5], "exp": "filter() drops rows, count() collapses to one row per value, distinct() drops duplicate rows. select() changes columns, mutate() adds a column, arrange() only reorders.", "d": 3}, {"id": "verbs02", "topic": "verbs", "type": "mc", "prompt": "What happens when this chain runs?", "code": "coffee_clean_df |>\n  group_by(account) |>\n  summarize(mean_spending = mean(spending)) |>\n  arrange(desc(spending))", "opts": ["It returns the accounts sorted by mean spending, largest first", "It errors: after summarize() the column spending no longer exists", "It returns one row because summarize() always returns one row", "It runs, but desc() is ignored because the table is grouped"], "ans": 1, "exp": "summarize() returns a NEW table that holds only the grouping column(s) and the summaries you created (account and mean_spending). arrange(desc(spending)) then cannot find spending.", "d": 2}, {"id": "verbs03", "topic": "verbs", "type": "mc", "prompt": "This line is meant to keep only the Scout rows. What is wrong?", "code": "menu_df |>\n  filter(shop = \"Scout Coffee\")", "opts": ["Nothing, it works", "The comparison needs == instead of =", "filter() needs quotes around the column name", "The pipe should be %>% in this course"], "ans": 1, "exp": "A single = is assignment/naming, not comparison. filter(shop == \"Scout Coffee\") is correct. dplyr stops with an error that suggests ==.", "d": 2}, {"id": "verbs04", "topic": "verbs", "type": "mc", "prompt": "The chain below was meant to keep high-AQI rows and sort them. What actually happens?", "code": "air_df |>\n  filter(aqi > 100)\n  arrange(desc(aqi))", "opts": ["Everything works as intended", "The filter result prints, then arrange(desc(aqi)) runs alone and errors (object 'aqi' not found)", "R silently sorts the original air_df", "filter() is skipped and only arrange() runs on air_df"], "ans": 1, "exp": "There is no |> after filter(aqi > 100), so the chain ends there. The next line is a new statement with no data frame, so desc(aqi) cannot find aqi.", "d": 2}, {"id": "verbs05", "topic": "verbs", "type": "mc", "prompt": "coffee_clean_df has 744 rows and 5 accounts. How many rows does this return?", "code": "coffee_clean_df |>\n  group_by(account) |>\n  mutate(m = mean(spending))", "opts": ["5", "744", "1", "821"], "ans": 1, "exp": "mutate() keeps every row. Inside a grouped table it computes the group mean and repeats it on each row of that group, so the row count stays 744.", "d": 2}, {"id": "verbs06", "topic": "verbs", "type": "mc", "prompt": "Compare the two lines on the 744-row coffee_clean_df. Which statement is correct?", "code": "coffee_clean_df |> mutate(m = mean(spending))\ncoffee_clean_df |> summarize(m = mean(spending))", "opts": ["Both return 744 rows", "mutate() returns 744 rows with the mean repeated; summarize() returns 1 row", "mutate() returns 1 row; summarize() returns 744 rows", "Both return 1 row"], "ans": 1, "exp": "mutate() adds a column and keeps all rows (the overall mean repeats on each). summarize() collapses to a single row.", "d": 2}, {"id": "verbs07", "topic": "verbs", "type": "mc", "prompt": "The reference answers: mean spending in 2025 per account, largest first. Which chain returns EXACTLY the same table?", "code": "coffee_clean_df |>\n  filter(year == 2025) |>\n  group_by(account) |>\n  summarize(m = mean(spending)) |>\n  arrange(desc(m))", "opts": ["group_by(account) |> filter(year == 2025) |> summarize(m = mean(spending)) |> arrange(desc(m))", "summarize(m = mean(spending)) |> group_by(account) |> filter(year == 2025) |> arrange(desc(m))", "group_by(account) |> summarize(m = mean(spending)) |> filter(year == 2025) |> arrange(desc(m))", "filter(year == 2025) |> summarize(m = mean(spending)) |> group_by(account) |> arrange(desc(m))"], "ans": 0, "exp": "filter() and group_by() can swap: the same rows land in the same groups. Any chain that summarizes before filtering year (or before grouping by account) either errors or answers a different question.", "d": 2}, {"id": "verbs08", "topic": "verbs", "type": "mc", "prompt": "What does .groups = \"drop\" do in summarize()?", "code": null, "opts": ["Drops the groups that have fewer than 2 rows", "Returns the summary as an ungrouped table", "Drops NA values before summarizing", "Removes the grouping columns from the result"], "ans": 1, "exp": "After summarizing by two columns, dplyr keeps some grouping on the result. .groups = \"drop\" removes it, so later verbs work on the whole summary table. The grouping columns stay as ordinary columns.", "d": 2}, {"id": "verbs09", "topic": "verbs", "type": "mc", "prompt": "Which line is equivalent to count(account)?", "code": null, "opts": ["group_by(account) |> summarize(n = n())", "summarize(n = n(account))", "mutate(n = n()) |> select(account)", "group_by(account) |> mutate(n = n())"], "ans": 0, "exp": "count(x) is shorthand for group_by(x) |> summarize(n = n()): one row per distinct value of x with its row count.", "d": 2}, {"id": "verbs10", "topic": "verbs", "type": "mc", "prompt": "Which expression gives the number of DIFFERENT accounts in coffee_df?", "code": null, "opts": ["n_distinct(coffee_df$account)", "n(coffee_df$account)", "sum(coffee_df$account)", "length(coffee_df)"], "ans": 0, "exp": "n_distinct() counts unique values. n() works only inside summarize()/mutate() and counts rows; sum() on text errors; length() of a data frame is its number of columns.", "d": 2}, {"id": "verbs11", "topic": "verbs", "type": "num", "prompt": "kb_df has 1,156 rows and 53 of them have PTS = NA. How many rows does this return?  kb_df |> filter(PTS >= 0) |> nrow()", "code": null, "ans": 1103, "tol": 0, "exp": "filter() keeps only rows where the condition is TRUE. For NA rows the condition is NA, so they are dropped too: 1,156 - 53 = 1,103 (points cannot be negative).", "d": 2, "unit": null}, {"id": "verbs12", "topic": "verbs", "type": "mc", "prompt": "kb_df has 1,156 rows, 53 with PTS = NA. Does filter(PTS < 20 | PTS >= 20) return all 1,156 rows?", "code": null, "opts": ["Yes, every number is either < 20 or >= 20", "No, it returns 1,103 rows: the NA rows give NA, and filter() drops them", "No, it errors because of the NAs", "Yes, but with a warning"], "ans": 1, "exp": "NA < 20 is NA and NA >= 20 is NA, so NA | NA is NA. filter() keeps only TRUE. The 53 rows with a missing PTS silently disappear.", "d": 2}, {"id": "verbs13", "topic": "verbs", "type": "dims", "prompt": "coffee_df has 821 rows and 7 columns. What are the dimensions (rows x columns) of the result?", "code": "coffee_df |>\n  mutate(spending = -amount)", "ans": [821, 8], "exp": "mutate() adds one column (spending) and keeps all rows: 821 x 8.", "d": 3}, {"id": "verbs14", "topic": "verbs", "type": "dims", "prompt": "coffee_df has 821 rows and 7 columns. Dimensions of the result?", "code": "coffee_df |>\n  select(description, amount, account, month, year) |>\n  mutate(spending = -amount)", "ans": [821, 6], "exp": "select() keeps 5 columns, then mutate() adds one: 6 columns. No rows are removed: 821 x 6.", "d": 3}, {"id": "verbs15", "topic": "verbs", "type": "mc", "prompt": "The memo lines in coffee_df are ALL CAPS. What does this return?", "code": "coffee_df |>\n  filter(str_detect(description, \"coffee\"))", "opts": ["All coffee purchases", "A red error because 'coffee' is not a column", "A table with 0 rows and no error", "All rows, since str_detect() ignores case"], "ans": 2, "exp": "str_detect() is case sensitive. No memo contains lowercase 'coffee', so the condition is FALSE everywhere and filter() returns 0 rows. This is a SILENT failure: no error, wrong answer.", "d": 2}, {"id": "verbs16", "topic": "verbs", "type": "mc", "prompt": "The account summary shows Kelley with mean spending 14.66 and n = 2. What is the right reading?", "code": null, "opts": ["Kelley is clearly the biggest spender, so recommend that account", "The mean rests on only 2 purchases, so it is weak evidence; always keep n() beside the mean", "n = 2 means there are 2 Kelleys", "The mean is wrong because n is small"], "ans": 1, "exp": "A mean of two numbers is not a habit. n() rides along in every summarize() so readers can judge how much evidence is behind each mean.", "d": 2}, {"id": "verbs17", "topic": "verbs", "type": "mc", "prompt": "Which two chains return exactly the same rows?", "code": null, "opts": ["filter(a > 1) |> filter(b < 5)   and   filter(a > 1 & b < 5)", "filter(a > 1) |> filter(b < 5)   and   filter(a > 1 | b < 5)", "filter(a > 1) |> select(b)   and   select(b) |> filter(a > 1)", "arrange(a) |> filter(a > 1)   and   filter(a > 1) |> select(a)"], "ans": 0, "exp": "Two filter() calls are an AND, the same as &. The third pair errors in the second chain because a is gone after select(b).", "d": 2}, {"id": "verbs18", "topic": "verbs", "type": "mc", "prompt": "Which call is equivalent to mean(x, na.rm = TRUE)?", "code": null, "opts": ["x |> mean(na.rm = TRUE)", "x |> mean(x, na.rm = TRUE)", "mean(na.rm = TRUE) |> x", "x |> na.rm(mean)"], "ans": 0, "exp": "The pipe inserts the left side as the FIRST argument of the function on the right. Writing x again would pass it twice.", "d": 2}, {"id": "verbs19", "topic": "verbs", "type": "mc", "prompt": "Without any group_by(), what does summarize(n = n(), mean_price = mean(price)) return?", "code": null, "opts": ["One row per row of the table", "One row with two columns", "Two rows", "An error because group_by() is required"], "ans": 1, "exp": "An ungrouped summarize() collapses the whole table into one row: n and mean_price.", "d": 2}, {"id": "verbs20", "topic": "verbs", "type": "mc", "prompt": "You want the single largest coffee purchase. Which line puts it on row 1?", "code": null, "opts": ["arrange(spending)", "arrange(desc(spending))", "filter(max(spending))", "select(desc(spending))"], "ans": 1, "exp": "arrange() sorts ascending by default, which would put the $1.00 purchases first. desc() flips it so the largest is on line 1.", "d": 2}, {"id": "verbs21", "topic": "verbs", "type": "mc", "prompt": "After filtering to coffee purchases, the account summary has these n values: 14, 2, 72, 633, 23. How many coffee purchases are there in total?", "code": null, "opts": ["5", "744", "821", "633"], "ans": 1, "exp": "The summary rows partition the filtered table: 14 + 2 + 72 + 633 + 23 = 744 coffee purchases across 5 accounts.", "d": 2}, {"id": "verbs22", "topic": "verbs", "type": "mc", "prompt": "Which is the right verb for 'keep the rows whose memo contains COFFEE'?", "code": null, "opts": ["select(str_detect(description, \"COFFEE\"))", "filter(str_detect(description, \"COFFEE\"))", "mutate(str_detect(description, \"COFFEE\"))", "summarize(str_detect(description, \"COFFEE\"))"], "ans": 1, "exp": "A condition that decides which ROWS stay belongs in filter(). select() chooses columns.", "d": 2}, {"id": "verbs23", "topic": "verbs", "type": "mc", "prompt": "Each verb receives the table produced by the previous step. Which fix makes this chain run WITHOUT deleting the select() line?", "code": "kb_df |>\n  select(Season, PTS, Opp) |>\n  filter(MP > 30)", "opts": ["select(Season, PTS, Opp, MP)", "filter(MP >= 30)", "select(Season, PTS)", "arrange(MP)"], "ans": 0, "exp": "After select(Season, PTS, Opp) only those three columns exist. Add MP to select() (or filter on MP BEFORE the select).", "d": 2}, {"id": "verbs24", "topic": "verbs", "type": "dims", "prompt": "lattes_df is shown in full. What are the dimensions (rows x columns) of the result?", "code": "lattes_df\nshop       drink      price  iced\nJulian's   latte      4.75   1\nJulian's   mocha      5.25   0\nScout      latte      5.95   1\nScout      cold brew  5.25   1\nScout      mocha      6.45   0\nStarbucks  latte      5.45   1\nStarbucks  mocha      5.95   0\nCampus     drip       3.25   0\nCampus     latte      4.25   1\nKreuzberg  latte      5.25   1\n\nlattes_df |>\n  filter(price >= 5.25) |>\n  filter(iced == 1) |>\n  select(shop, price)", "ans": [4, 2], "exp": "price >= 5.25 keeps 7 rows (5.25 passes because >= includes the boundary); iced == 1 keeps 4 of them; select() keeps 2 columns.", "d": 3}, {"id": "verbs25", "topic": "verbs", "type": "dims", "prompt": "lattes_df is shown in full. What are the dimensions (rows x columns) of the result?", "code": "lattes_df\nshop       drink      price  iced\nJulian's   latte      4.75   1\nJulian's   mocha      5.25   0\nScout      latte      5.95   1\nScout      cold brew  5.25   1\nScout      mocha      6.45   0\nStarbucks  latte      5.45   1\nStarbucks  mocha      5.95   0\nCampus     drip       3.25   0\nCampus     latte      4.25   1\nKreuzberg  latte      5.25   1\n\nlattes_df |>\n  mutate(with_tip = price + 1) |>\n  filter(with_tip > 6.5) |>\n  select(shop, drink, with_tip)", "ans": [3, 3], "exp": "with_tip > 6.5 means price > 5.5: Scout latte 5.95, Scout mocha 6.45, Starbucks mocha 5.95. Three columns kept.", "d": 3}, {"id": "verbs26", "topic": "verbs", "type": "dims", "prompt": "lattes_df is shown in full. What are the dimensions (rows x columns) of the result?", "code": "lattes_df\nshop       drink      price  iced\nJulian's   latte      4.75   1\nJulian's   mocha      5.25   0\nScout      latte      5.95   1\nScout      cold brew  5.25   1\nScout      mocha      6.45   0\nStarbucks  latte      5.45   1\nStarbucks  mocha      5.95   0\nCampus     drip       3.25   0\nCampus     latte      4.25   1\nKreuzberg  latte      5.25   1\n\nlattes_df |>\n  group_by(shop) |>\n  summarize(n = n(), mean_price = mean(price))", "ans": [5, 3], "exp": "One row per shop (5 shops); columns shop, n, mean_price.", "d": 3}, {"id": "verbs27", "topic": "verbs", "type": "dims", "prompt": "lattes_df is shown in full. What are the dimensions (rows x columns) of the result?", "code": "lattes_df\nshop       drink      price  iced\nJulian's   latte      4.75   1\nJulian's   mocha      5.25   0\nScout      latte      5.95   1\nScout      cold brew  5.25   1\nScout      mocha      6.45   0\nStarbucks  latte      5.45   1\nStarbucks  mocha      5.95   0\nCampus     drip       3.25   0\nCampus     latte      4.25   1\nKreuzberg  latte      5.25   1\n\nlattes_df |>\n  group_by(shop, iced) |>\n  summarize(n = n(), .groups = \"drop\")", "ans": [9, 3], "exp": "group_by on two columns gives one row per COMBINATION that actually occurs in the data, not shops x iced = 10. Columns: shop, iced, n.", "d": 3}, {"id": "verbs28", "topic": "verbs", "type": "dims", "prompt": "lattes_df is shown in full. What are the dimensions (rows x columns) of the result?", "code": "lattes_df\nshop       drink      price  iced\nJulian's   latte      4.75   1\nJulian's   mocha      5.25   0\nScout      latte      5.95   1\nScout      cold brew  5.25   1\nScout      mocha      6.45   0\nStarbucks  latte      5.45   1\nStarbucks  mocha      5.95   0\nCampus     drip       3.25   0\nCampus     latte      4.25   1\nKreuzberg  latte      5.25   1\n\nlattes_df |>\n  filter(drink == \"latte\") |>\n  group_by(shop) |>\n  summarize(mean_price = mean(price)) |>\n  arrange(desc(mean_price))", "ans": [5, 2], "exp": "All 5 shops sell a latte, so 5 groups remain; columns shop and mean_price.", "d": 3}, {"id": "verbs29", "topic": "verbs", "type": "dims", "prompt": "lattes_df is shown in full. What are the dimensions (rows x columns) of the result?", "code": "lattes_df\nshop       drink      price  iced\nJulian's   latte      4.75   1\nJulian's   mocha      5.25   0\nScout      latte      5.95   1\nScout      cold brew  5.25   1\nScout      mocha      6.45   0\nStarbucks  latte      5.45   1\nStarbucks  mocha      5.95   0\nCampus     drip       3.25   0\nCampus     latte      4.25   1\nKreuzberg  latte      5.25   1\n\nlattes_df |>\n  group_by(shop) |>\n  mutate(shop_mean = mean(price))", "ans": [10, 5], "exp": "mutate() keeps all 10 rows and adds one column: 4 + 1 = 5 columns.", "d": 3}, {"id": "verbs30", "topic": "verbs", "type": "dims", "prompt": "lattes_df is shown in full. What are the dimensions (rows x columns) of the result?", "code": "lattes_df\nshop       drink      price  iced\nJulian's   latte      4.75   1\nJulian's   mocha      5.25   0\nScout      latte      5.95   1\nScout      cold brew  5.25   1\nScout      mocha      6.45   0\nStarbucks  latte      5.45   1\nStarbucks  mocha      5.95   0\nCampus     drip       3.25   0\nCampus     latte      4.25   1\nKreuzberg  latte      5.25   1\n\nlattes_df |>\n  summarize(n = n(), mean_price = mean(price))", "ans": [1, 2], "exp": "No grouping: one row, two columns.", "d": 3}, {"id": "verbs31", "topic": "verbs", "type": "dims", "prompt": "lattes_df is shown in full. What are the dimensions (rows x columns) of the result?", "code": "lattes_df\nshop       drink      price  iced\nJulian's   latte      4.75   1\nJulian's   mocha      5.25   0\nScout      latte      5.95   1\nScout      cold brew  5.25   1\nScout      mocha      6.45   0\nStarbucks  latte      5.45   1\nStarbucks  mocha      5.95   0\nCampus     drip       3.25   0\nCampus     latte      4.25   1\nKreuzberg  latte      5.25   1\n\nlattes_df |>\n  mutate(pricey = price > 5) |>\n  count(pricey)", "ans": [2, 2], "exp": "pricey takes two values (TRUE/FALSE), so count() returns two rows with columns pricey and n.", "d": 3}, {"id": "verbs32", "topic": "verbs", "type": "num", "prompt": "Mean latte price at Scout, rounded to 2 decimals? (all rows of lattes_df are above)", "code": "lattes_df\nshop       drink      price  iced\nJulian's   latte      4.75   1\nJulian's   mocha      5.25   0\nScout      latte      5.95   1\nScout      cold brew  5.25   1\nScout      mocha      6.45   0\nStarbucks  latte      5.45   1\nStarbucks  mocha      5.95   0\nCampus     drip       3.25   0\nCampus     latte      4.25   1\nKreuzberg  latte      5.25   1\n\nlattes_df |>\n  filter(shop == \"Scout\") |>\n  summarize(m = round(mean(price), 2))", "ans": 5.88, "tol": 0.005, "exp": "Scout prices 5.95, 5.25, 6.45: mean = 17.65 / 3 = 5.883..., which rounds to 5.88.", "d": 2, "unit": null}, {"id": "verbs33", "topic": "verbs", "type": "mc", "prompt": "In the group_by(shop) |> summarize(mean_price = mean(price)) |> arrange(desc(mean_price)) result for lattes_df, which shop is on row 1?", "code": "lattes_df\nshop       drink      price  iced\nJulian's   latte      4.75   1\nJulian's   mocha      5.25   0\nScout      latte      5.95   1\nScout      cold brew  5.25   1\nScout      mocha      6.45   0\nStarbucks  latte      5.45   1\nStarbucks  mocha      5.95   0\nCampus     drip       3.25   0\nCampus     latte      4.25   1\nKreuzberg  latte      5.25   1", "opts": ["Julian's", "Scout", "Starbucks", "Campus"], "ans": 1, "exp": "Means: Scout 5.88, Starbucks 5.70, Kreuzberg 5.25, Julian's 5.00, Campus 3.75. Scout is first.", "d": 2}, {"id": "na01", "topic": "na", "type": "mc", "prompt": "What does mean(c(3, NA, 5)) return?", "code": null, "opts": ["4", "NA", "8", "An error"], "ans": 1, "exp": "A mean over a set containing an unknown value is unknown. R returns NA rather than guess.", "d": 2}, {"id": "na02", "topic": "na", "type": "mc", "prompt": "What does mean(c(4, NA, 8, 6), na.rm = TRUE) return?", "code": null, "opts": ["4.5", "6", "NA", "18"], "ans": 1, "exp": "na.rm = TRUE drops the NA first and divides by the 3 remaining values: (4 + 8 + 6) / 3 = 6. 4.5 would treat the NA as a zero.", "d": 2}, {"id": "na03", "topic": "na", "type": "num", "prompt": "What does sum(is.na(c(88, 92, NA, 75, NA, 100))) return?", "code": null, "ans": 2, "tol": 0, "exp": "is.na() gives one TRUE/FALSE per value; each TRUE counts as 1 when summed.", "d": 2, "unit": null}, {"id": "na04", "topic": "na", "type": "num", "prompt": "What does mean(is.na(c(1, NA, 3, NA))) return?", "code": null, "ans": 0.5, "tol": 0.001, "exp": "is.na() gives FALSE TRUE FALSE TRUE; the mean of a logical vector is the proportion of TRUEs: 2/4 = 0.5.", "d": 2, "unit": null}, {"id": "na05", "topic": "na", "type": "mc", "prompt": "What does NA == NA return?", "code": null, "opts": ["TRUE", "FALSE", "NA", "An error"], "ans": 2, "exp": "Comparing an unknown to an unknown is unknown. Use is.na() to test for missingness.", "d": 2}, {"id": "na06", "topic": "na", "type": "num", "prompt": "What does sum(c(1, NA, 3), na.rm = TRUE) return?", "code": null, "ans": 4, "tol": 0, "exp": "The NA is removed, then 1 + 3 = 4.", "d": 2, "unit": null}, {"id": "na07", "topic": "na", "type": "mc", "prompt": "What does max(c(2, NA, 9)) return?", "code": null, "opts": ["9", "2", "NA", "11"], "ans": 2, "exp": "Like mean(), max() returns NA when an unknown is present. max(c(2, NA, 9), na.rm = TRUE) is 9.", "d": 2}, {"id": "na08", "topic": "na", "type": "num", "prompt": "What does mean(c(TRUE, FALSE, NA, TRUE), na.rm = TRUE) return, rounded to 2 decimals?", "code": null, "ans": 0.67, "tol": 0.005, "exp": "After dropping the NA: TRUE FALSE TRUE, so 2/3 = 0.67.", "d": 2, "unit": null}, {"id": "na09", "topic": "na", "type": "mc", "prompt": "x <- c(5, NA, 7, NA). What does which(is.na(x)) return?", "code": null, "opts": ["2 4", "TRUE for positions 2 and 4", "1 3", "2"], "ans": 0, "exp": "is.na(x) is FALSE TRUE FALSE TRUE; which() returns the positions that are TRUE: 2 and 4.", "d": 2}, {"id": "na10", "topic": "na", "type": "num", "prompt": "kb_df has 1,156 rows, 53 with PTS = NA. mean(kb_df$PTS, na.rm = TRUE) divides the total points by how many games?", "code": null, "ans": 1103, "tol": 0, "exp": "na.rm = TRUE removes the 53 NAs first, so the denominator is 1,156 - 53 = 1,103.", "d": 2, "unit": null}, {"id": "na11", "topic": "na", "type": "mc", "prompt": "Game_Location is only 'Home' or 'Away'. In group_by(Game_Location) |> summarize(games = n(), mean_pts = mean(PTS, na.rm = TRUE)), what is the sum of the games column?", "code": null, "opts": ["1,103", "1,156", "53", "2"], "ans": 1, "exp": "n() counts ROWS, NA or not. The two groups together hold all 1,156 rows. Only mean_pts excludes the 53 missing values.", "d": 2}, {"id": "na12", "topic": "na", "type": "mc", "prompt": "td_df uses summarize(triple_doubles = sum(TD, na.rm = TRUE)). Without na.rm = TRUE, which players would show NA?", "code": null, "opts": ["Kobe and LeBron, whose sheets have unrecorded games; not Jordan", "All three players", "Only Jordan", "None, sum() ignores NA"], "ans": 0, "exp": "NA games exist for Kobe (53) and LeBron (71) but not for Jordan (0), so only their sums turn into NA.", "d": 2}, {"id": "na13", "topic": "na", "type": "mc", "prompt": "In the Lab 8 drill data, correct is NA for an unknown outcome. How should accuracy be computed?", "code": null, "opts": ["correct / all valid responses, treating NA as incorrect", "correct / valid responses with a KNOWN outcome", "correct / voided responses", "mean(correct), because NA is ignored automatically"], "ans": 1, "exp": "An unknown outcome is not an incorrect answer. The denominator is non-missing outcomes among valid responses. A group with no known outcomes gets 'unavailable', not zero.", "d": 2}, {"id": "na14", "topic": "na", "type": "mc", "prompt": "A flight is cancelled when dep_delay is NA. Which pair of summaries counts cancelled flights and the share cancelled?", "code": null, "opts": ["cancelled = sum(is.na(dep_delay)); share = cancelled / flights", "cancelled = sum(dep_delay); share = cancelled / n()", "cancelled = n(dep_delay); share = flights / cancelled", "cancelled = is.na(dep_delay); share = mean(cancelled)"], "ans": 0, "exp": "sum(is.na()) counts the NAs; a share is a count divided by the total: cancelled / flights. In summarize() a later column may use an earlier one.", "d": 2}, {"id": "na15", "topic": "na", "type": "mc", "prompt": "Every mean delay in the flights notes uses mean(dep_delay, na.rm = TRUE). What is the caveat to state?", "code": null, "opts": ["Nothing, NA rows are irrelevant", "About 8,255 cancelled flights are excluded, so bad days look better than they were", "The mean is biased upward because NA counts as 0", "na.rm = TRUE keeps the cancelled flights at 0 minutes"], "ans": 1, "exp": "Cancelled flights have no departure delay. They are dropped from the mean, so days with many cancellations look better than the passenger experience was.", "d": 2}, {"id": "na16", "topic": "na", "type": "mc", "prompt": "Which statement about mean(x) versus mean(x, na.rm = TRUE) is correct for x = c(10, NA, 20)?", "code": null, "opts": ["Both return 15", "The first returns NA, the second returns 15", "The first returns 10, the second returns 15", "The first returns 15, the second returns NA"], "ans": 1, "exp": "Default na.rm is FALSE, so any NA makes the result NA. With na.rm = TRUE: (10 + 20) / 2 = 15.", "d": 2}, {"id": "str01", "topic": "str", "type": "mc", "prompt": "What prints?", "code": "str_remove(\"a_b_c_d\", \"_\")", "opts": ["\"ab_c_d\"", "\"abcd\"", "\"a b c d\"", "\"_\""], "ans": 0, "exp": "str_remove() deletes only the FIRST match. The first underscore goes; the other two stay.", "d": 2}, {"id": "str02", "topic": "str", "type": "mc", "prompt": "What prints?", "code": "str_replace(\"a_b_c_d\", \"_\", \"-\")", "opts": ["\"a-b-c-d\"", "\"a-b_c_d\"", "\"a_b_c_d-\"", "\"-\""], "ans": 1, "exp": "str_replace() swaps only the first match, like str_remove().", "d": 2}, {"id": "str03", "topic": "str", "type": "mc", "prompt": "What does str_detect() return, and of what type?", "code": "str_detect(c(\"shipped\", \"delayed\", \"shipped\"), \"shipped\")", "opts": ["TRUE FALSE TRUE: a logical vector, one value per string", "\"shipped\" NA \"shipped\": a character vector", "2: a count", "a data frame"], "ans": 0, "exp": "str_detect() answers a yes/no question for each string, so it returns a logical vector the same length as the input. It feeds filter() or sum().", "d": 2}, {"id": "str04", "topic": "str", "type": "mc", "prompt": "What does this return?", "code": "str_remove(\"93 min\", \"min\") == \"93\"", "opts": ["TRUE", "FALSE", "NA", "An error"], "ans": 1, "exp": "str_remove() leaves a trailing space: \"93 \" is not equal to \"93\". Include the space in the pattern (\" min\") to remove it.", "d": 2}, {"id": "str05", "topic": "str", "type": "mc", "prompt": "What is the class of str_remove(\"93 min\", \" min\")?", "code": null, "opts": ["numeric", "character", "integer", "factor"], "ans": 1, "exp": "str_remove() always returns text. \"93\" in quotes is not a number until as.numeric() is applied.", "d": 2}, {"id": "str06", "topic": "str", "type": "num", "prompt": "How many TRUEs does sum(str_detect(c(\"LAL\", \"LAC\", \"GSW\", \"LAL\", \"SAC\"), \"LA\")) return?", "code": null, "ans": 3, "tol": 0, "exp": "\"LAL\", \"LAC\" and \"LAL\" contain the exact text LA. \"SAC\" does not (the letters are S-A-C).", "d": 2, "unit": null}, {"id": "str07", "topic": "str", "type": "num", "prompt": "How many TRUEs does sum(str_detect(c(\"LAL\", \"LAC\", \"GSW\"), \"la\")) return?", "code": null, "ans": 0, "tol": 0, "exp": "str_detect() is case sensitive. The codes are capitals, so \"la\" matches nothing: 0.", "d": 2, "unit": null}, {"id": "str08", "topic": "str", "type": "mc", "prompt": "Why must season be turned into a number before filter(season_number <= 5)?", "code": "kb_df |>\n  mutate(season_number = str_remove(Season, \"season_\")) |>\n  filter(season_number <= 5)", "opts": ["Text compares alphabetically, so \"10\" <= \"5\" is TRUE and the wrong seasons are kept", "R refuses to compare text with a number", "str_remove() already returns a number", "filter() only works on numeric columns"], "ans": 0, "exp": "\"10\" sorts before \"5\" as text (\"1\" < \"5\"). as.numeric(str_remove(Season, \"season_\")) makes the comparison numeric.", "d": 2}, {"id": "str09", "topic": "str", "type": "mc", "prompt": "What prints?", "code": "str_replace(\"TV-Y7-FV\", \"-\", \" \")", "opts": ["\"TV Y7-FV\"", "\"TV Y7 FV\"", "\"TV-Y7 FV\"", "\"TVY7-FV\""], "ans": 0, "exp": "str_replace() changes only the first \"-\" into a space.", "d": 2}, {"id": "str10", "topic": "str", "type": "mc", "prompt": "What prints?", "code": "str_remove(\"TV-Y7-FV\", \"-\")", "opts": ["\"TVY7-FV\"", "\"TVY7FV\"", "\"TV-Y7FV\"", "\"TV Y7-FV\""], "ans": 0, "exp": "Only the first \"-\" is removed.", "d": 2}, {"id": "str11", "topic": "str", "type": "mc", "prompt": "str_remove(x, pattern) is the same as which call?", "code": null, "opts": ["str_replace(x, pattern, \"\")", "str_detect(x, pattern)", "str_replace(pattern, x, \"\")", "str_replace(x, \"\", pattern)"], "ans": 0, "exp": "Removing is replacing with nothing.", "d": 2}, {"id": "str12", "topic": "str", "type": "num", "prompt": "x <- c(\"TV-G\", \"TV-14\", \"PG\", \"R\", \"TV-MA\"). What does mean(str_detect(x, \"TV\")) return?", "code": null, "ans": 0.6, "tol": 0.001, "exp": "str_detect() gives TRUE TRUE FALSE FALSE TRUE; the mean of a logical vector is the proportion of TRUE: 3/5 = 0.6.", "d": 2, "unit": null}, {"id": "str13", "topic": "str", "type": "mc", "prompt": "What does str_remove(\"hello\", \"z\") return?", "code": null, "opts": ["\"hello\"", "\"\"", "NA", "An error"], "ans": 0, "exp": "If the pattern is not found, nothing is removed and the string comes back unchanged.", "d": 2}, {"id": "str14", "topic": "str", "type": "num", "prompt": "How many TRUEs? x <- c(\"SQ *SCOUT COFFEE\", \"STARBUCKS\", \"JULIANS COFFEE\", \"VENMO\"); sum(str_detect(x, \"COFFEE\"))", "code": null, "ans": 2, "tol": 0, "exp": "Only the first and third memos contain COFFEE.", "d": 2, "unit": null}, {"id": "str15", "topic": "str", "type": "mc", "prompt": "What does str_replace(\"93 min\", \"min\", \"minutes\") return?", "code": null, "opts": ["\"93 minutes\"", "\"93 min minutes\"", "\"minutes\"", "\"93\""], "ans": 0, "exp": "The matched piece is swapped for the third argument.", "d": 2}, {"id": "str16", "topic": "str", "type": "num", "prompt": "What number does as.numeric(str_remove(\"season_7\", \"season_\")) + 1 return?", "code": null, "ans": 8, "tol": 0, "exp": "\"season_7\" becomes \"7\", as.numeric() makes it 7, plus 1 is 8.", "d": 2, "unit": null}, {"id": "str17", "topic": "str", "type": "mc", "prompt": "Which stringr function answers a yes/no question and changes the TYPE of the result to logical?", "code": null, "opts": ["str_detect()", "str_remove()", "str_replace()", "str_sub()"], "ans": 0, "exp": "str_remove() and str_replace() return edited text of the same length; str_detect() returns TRUE/FALSE.", "d": 2}, {"id": "str18", "topic": "str", "type": "mc", "prompt": "For text <- c(\"Order #123 shipped\", \"Order #456 delayed\"), what does str_remove(text, \"Order #\") return?", "code": null, "opts": ["\"123 shipped\" \"456 delayed\"", "\"Order 123 shipped\" \"Order 456 delayed\"", "\"#123 shipped\" \"#456 delayed\"", "TRUE TRUE"], "ans": 0, "exp": "The matched text \"Order #\" is deleted from the start of each string; the rest stays.", "d": 2}, {"id": "fct01", "topic": "fct", "type": "mc", "prompt": "What does sort(c(\"M\", \"S\", \"L\", \"M\")) return?", "code": null, "opts": ["\"L\" \"M\" \"M\" \"S\"", "\"S\" \"M\" \"M\" \"L\"", "\"M\" \"M\" \"S\" \"L\"", "\"S\" \"M\" \"L\" \"M\""], "ans": 0, "exp": "Text sorts alphabetically, which is meaningless for shirt sizes. A factor with levels c(\"S\", \"M\", \"L\") would sort S, M, M, L.", "d": 2}, {"id": "fct02", "topic": "fct", "type": "mc", "prompt": "year_fct <- factor(c(\"Fr\", \"So\", \"Jr\", \"Sr\", \"So\", \"Fr\")). What does levels(year_fct) return?", "code": null, "opts": ["\"Fr\" \"Jr\" \"So\" \"Sr\"", "\"Fr\" \"So\" \"Jr\" \"Sr\"", "\"Fr\" \"So\" \"Jr\" \"Sr\" \"So\" \"Fr\"", "\"Sr\" \"So\" \"Jr\" \"Fr\""], "ans": 0, "exp": "With no levels = argument, factor() orders levels alphabetically. Levels are the distinct categories, not one per value.", "d": 2}, {"id": "fct03", "topic": "fct", "type": "num", "prompt": "How many NA values does this create?", "code": "factor(c(\"morning\", \"Morning\", \"evening\"),\n       levels = c(\"morning\", \"afternoon\", \"evening\"))", "ans": 1, "tol": 0, "exp": "\"Morning\" (capital M) is not on the factor's menu, so it silently becomes NA. R gives no error and no warning.", "d": 2, "unit": null}, {"id": "fct04", "topic": "fct", "type": "num", "prompt": "How many levels does factor(c(\"S\", \"M\", \"L\", \"M\")) have?", "code": null, "ans": 3, "tol": 0, "exp": "Levels are the distinct values: L, M, S. The vector has 4 values but 3 levels.", "d": 2, "unit": null}, {"id": "fct05", "topic": "fct", "type": "mc", "prompt": "Which call renames the level \"Fr\" to \"Freshman\"?", "code": null, "opts": ["fct_recode(year_fct, Freshman = \"Fr\")", "fct_recode(year_fct, Fr = \"Freshman\")", "fct_collapse(year_fct, Fr = \"Freshman\")", "fct_recode(\"Fr\", Freshman)"], "ans": 0, "exp": "The NEW name goes on the left and the OLD level in quotes on the right: new = \"old\".", "d": 2}, {"id": "fct06", "topic": "fct", "type": "mc", "prompt": "A classmate runs fct_recode(year_fct, Fr = \"Freshman\"). What happens?", "code": null, "opts": ["A red error stops the code", "A warning (Unknown levels in `f`) and the factor comes back unchanged", "The level Fr is renamed to Freshman anyway", "The factor is converted to character"], "ans": 1, "exp": "The line asks R to find an old level called \"Freshman\", which does not exist. It is a WARNING, not an error: the code runs and silently changes nothing.", "d": 2}, {"id": "fct07", "topic": "fct", "type": "num", "prompt": "Levels: G, TV-G, PG, TV-PG, R. How many levels result?", "code": "fct_collapse(rating,\n  Kids  = c(\"G\", \"TV-G\"),\n  Teens = c(\"PG\", \"TV-PG\"))", "ans": 3, "tol": 0, "exp": "Kids and Teens each merge two levels, but R was never listed, so it stays as its own level: Kids, Teens, R = 3. A forgotten code stays visible in count().", "d": 2, "unit": null}, {"id": "fct08", "topic": "fct", "type": "num", "prompt": "The 14 Netflix rating codes are grouped into Kids, Teens, Adults, Unrated with fct_collapse(). How many levels come out?", "code": null, "ans": 4, "tol": 0, "exp": "fct_collapse() creates one level per name on the left: 4 groups, down from 14.", "d": 2, "unit": null}, {"id": "fct09", "topic": "fct", "type": "num", "prompt": "kinds is a factor with levels Movie and TV Show. How many levels after fct_recode(kinds, Film = \"Movie\", Series = \"TV Show\")?", "code": null, "ans": 2, "tol": 0, "exp": "Recoding renames; the number of levels stays the same.", "d": 2, "unit": null}, {"id": "fct10", "topic": "fct", "type": "num", "prompt": "f <- factor(c(\"a\", \"b\", \"c\")). How many levels after fct_recode(f, X = \"a\", X = \"b\")?", "code": null, "ans": 2, "tol": 0, "exp": "fct_recode() can merge: two old levels given the same new name become one level. Result levels: X and c. (fct_collapse() is just clearer for this job.)", "d": 2, "unit": null}, {"id": "fct11", "topic": "fct", "type": "mc", "prompt": "drink <- factor(c(\"latte\", \"mocha\", \"latte\", \"drip\", \"latte\", \"drip\")). What are the levels after fct_infreq(drink)?", "code": null, "opts": ["latte drip mocha", "drip latte mocha", "mocha drip latte", "latte mocha drip"], "ans": 0, "exp": "fct_infreq() orders levels by frequency: latte (3), drip (2), mocha (1). The values themselves do not move; only the Levels line changes.", "d": 2}, {"id": "fct12", "topic": "fct", "type": "mc", "prompt": "Compare drink before and after fct_infreq(). What changed?", "code": null, "opts": ["Only the order of the levels", "The values were re-sorted", "The number of levels", "Some levels were renamed"], "ans": 0, "exp": "Each value is still in its original position. Only the level order (alphabetical to most frequent first) changed.", "d": 2}, {"id": "fct13", "topic": "fct", "type": "num", "prompt": "Opp has 34 codes. How many levels does fct_lump_n(Opp, n = 5) have?", "code": null, "ans": 6, "tol": 0, "exp": "fct_lump_n() keeps the 5 most common levels and lumps all the rest into \"Other\": 5 + 1 = 6.", "d": 2, "unit": null}, {"id": "fct14", "topic": "fct", "type": "mc", "prompt": "Which forcats function orders the bars of a plot by the size of a numeric summary such as mean_pts?", "code": null, "opts": ["fct_reorder()", "fct_recode()", "fct_collapse()", "fct_lump_n()"], "ans": 0, "exp": "fct_reorder() reorders levels by another variable. fct_recode() renames, fct_collapse() merges, fct_lump_n() keeps the top n.", "d": 2}, {"id": "fct15", "topic": "fct", "type": "mc", "prompt": "month(d, label = TRUE) returns what?", "code": null, "opts": ["A factor whose levels are in calendar order (Jan to Dec)", "Plain text sorted alphabetically", "A number from 1 to 12", "A Date"], "ans": 0, "exp": "label = TRUE gives names stored as a factor with calendar-ordered levels, so tables and plots sort Jan to Dec.", "d": 2}, {"id": "fct16", "topic": "fct", "type": "mc", "prompt": "flights_df |> count(weekday) prints Sun, Mon, Tue ... Sat. What made it come out in calendar order?", "code": null, "opts": ["weekday is a factor from wday(label = TRUE) with levels in calendar order", "count() sorts days automatically", "R sorts three-letter names by weekday", "A scale function was added"], "ans": 0, "exp": "The factor's levels set the order. Text would have sorted alphabetically: Fri, Mon, Sat, Sun, Thu, Tue, Wed.", "d": 2}, {"id": "fct17", "topic": "fct", "type": "mc", "prompt": "flights_df is written to CSV and read back. What happens to the weekday column?", "code": null, "opts": ["It comes back as plain text, so tables sort alphabetically until wday(label = TRUE) is re-run", "It stays a factor with the same levels", "It becomes numeric", "It is dropped"], "ans": 0, "exp": "A CSV is plain text and cannot store factor levels. Dates survive because they are written year-month-day and read_csv() re-parses them.", "d": 2}, {"id": "fct18", "topic": "fct", "type": "mc", "prompt": "What is the best reason to turn sizes (small, medium, large) into a factor before a bar chart?", "code": null, "opts": ["The bars follow small, medium, large instead of alphabetical order", "Factors make bars thicker", "Factors are required by geom_col()", "Text cannot be plotted"], "ans": 0, "exp": "Levels let you control the order: small, medium, large rather than large, medium, small.", "d": 2}, {"id": "fct19", "topic": "fct", "type": "mc", "prompt": "Which pair of changes does NOT reduce the number of levels?", "code": null, "opts": ["fct_recode() with all different new names", "fct_collapse() grouping 4 levels into 2", "fct_lump_n(n = 3) on 10 levels", "fct_recode() giving two old levels the same new name"], "ans": 0, "exp": "Pure renaming keeps the same number of categories. Collapsing, lumping, or a recode that merges all reduce the count.", "d": 2}, {"id": "fct20", "topic": "fct", "type": "mc", "prompt": "Which of these produces NO red error and silently loses information?", "code": null, "opts": ["factor(c(\"a\", \"A\"), levels = c(\"a\", \"b\"))", "tibble(a = 1:3, b = 1:2)", "read_csv(\"missing_file.csv\")", "mean(\"text\")"], "ans": 0, "exp": "The off-menu \"A\" becomes NA with no message. The tibble, missing file, and text mean all give loud errors or warnings.", "d": 2}, {"id": "fct21", "topic": "fct", "type": "mc", "prompt": "What is the difference between character and factor in one sentence?", "code": null, "opts": ["A factor is text plus a fixed menu of allowed levels in an order you control", "A factor is a number, a character is text", "They are identical except for the printing", "A character has levels, a factor does not"], "ans": 0, "exp": "Use a factor when a column is a category you will count, group, or plot in a chosen order.", "d": 2}, {"id": "fct22", "topic": "fct", "type": "mc", "prompt": "After kind = fct_recode(type, Film = \"Movie\", Series = \"TV Show\"), what does count(type, kind) show?", "code": null, "opts": ["The same counts as before, with two names per row", "Different counts because values changed", "Only the new names", "An error"], "ans": 0, "exp": "Recoding renames levels without changing any row, so the counts per category are unchanged.", "d": 2}, {"id": "gg01", "topic": "gg", "type": "mc", "prompt": "What do you see when you run ggplot(year_summary_df) with nothing else?", "code": null, "opts": ["An empty panel", "A scatterplot", "A bar chart", "An error"], "ans": 0, "exp": "ggplot() has been told the data but nothing about which columns to draw or which shape to use. It prints an empty gray panel; this is not a failure.", "d": 2}, {"id": "gg02", "topic": "gg", "type": "mc", "prompt": "What do you see with ggplot(df, aes(x = year, y = mean_min)) and no geom?", "code": null, "opts": ["Axes with ranges taken from the data, but no marks", "A line chart", "An error", "A histogram"], "ans": 0, "exp": "aes() maps columns to x and y, so axes appear. Without a geom nothing is drawn.", "d": 2}, {"id": "gg03", "topic": "gg", "type": "mc", "prompt": "Which are the five pieces of a ggplot built in this course?", "code": null, "opts": ["data, aes(), a geom, labs(), a theme", "data, filter(), a geom, scale, a facet", "x, y, color, fill, size", "ggplot(), mutate(), geom, theme, summarize()"], "ans": 0, "exp": "data (which table), aesthetic mapping (which column controls which property), geom (what shape), labels (what a stranger needs), theme (how everything that is not data looks).", "d": 2}, {"id": "gg04", "topic": "gg", "type": "mc", "prompt": "Which statement about these two chunks is correct?", "code": "# Chunk 1\nggplot(lattes_df, aes(x = shop, y = price, color = iced)) +\n  geom_point()\n# Chunk 2\nggplot(lattes_df, aes(x = shop, y = price)) +\n  geom_point(color = \"red\")", "opts": ["Chunk 1 colors points by iced and adds a legend; Chunk 2 makes every point red with no legend", "Both draw red points", "Chunk 1 draws every point blue", "Chunk 2 adds a legend titled red"], "ans": 0, "exp": "A COLUMN goes inside aes() (mapping: the look varies with the data and a legend appears). A CONSTANT goes outside aes() as a geom argument.", "d": 2}, {"id": "gg05", "topic": "gg", "type": "mc", "prompt": "What does geom_col(fill = \"darkorange\") draw?", "code": null, "opts": ["All bars dark orange with no legend", "Bars in a color per category with a legend", "Only the outline in orange", "An error because fill needs aes()"], "ans": 0, "exp": "fill is set outside aes() as a constant: every bar looks the same and there is nothing to explain, so no legend.", "d": 2}, {"id": "gg06", "topic": "gg", "type": "mc", "prompt": "What does geom_col() draw for aes(x = slot, y = mean_count, fill = slot)?", "code": null, "opts": ["Three bars in three colors and a legend titled slot", "Three same-color bars", "One bar", "No legend because slot is on x"], "ans": 0, "exp": "fill is mapped to a column inside aes(), so each bar gets its own color and ggplot builds a legend. The legend is redundant here, but it is built.", "d": 2}, {"id": "gg07", "topic": "gg", "type": "mc", "prompt": "What happens with ggplot(df, aes(x = year, y = mean_min, color = \"steelblue\")) + geom_point()?", "code": null, "opts": ["Points are ONE default color (not blue) and a legend reads \"steelblue\"", "All points are steel blue", "An error: not a column", "Points are blue with no legend"], "ans": 0, "exp": "Inside aes(), \"steelblue\" is treated as data: a single-value column named steelblue. ggplot picks its default first color and labels it in a legend. Constants go OUTSIDE aes().", "d": 2}, {"id": "gg08", "topic": "gg", "type": "mc", "prompt": "lab_red <- \"#c0392b\". What does geom_point(aes(color = lab_red)) draw?", "code": null, "opts": ["Points in a default ggplot color with a legend labelled #c0392b", "Points in #c0392b with no legend", "An error because lab_red is not a column", "Red points because it is a color code"], "ans": 0, "exp": "Anything inside aes() is a mapping, even a constant. ggplot treats the single value as a category: default color plus a legend. Use geom_point(color = lab_red).", "d": 2}, {"id": "gg09", "topic": "gg", "type": "mc", "prompt": "Which argument of labs() renames the legend for a color-mapped variable?", "code": null, "opts": ["labs(color = \"Airport\")", "labs(legend = \"Airport\")", "labs(title = \"Airport\")", "labs(key = \"Airport\")"], "ans": 0, "exp": "The legend belongs to the aesthetic it explains, so it is named by that aesthetic: color =, or fill = for bars.", "d": 2}, {"id": "gg10", "topic": "gg", "type": "mc", "prompt": "You have a summary table: one row per category with a number already computed. Which geom?", "code": null, "opts": ["geom_col()", "geom_histogram()", "geom_line()", "geom_point() only"], "ans": 0, "exp": "geom_col() draws one bar per row with the height taken from y.", "d": 2}, {"id": "gg11", "topic": "gg", "type": "mc", "prompt": "You have 360 raw rows and one numeric column, and want the shape of its distribution. Which geom, and what goes in aes()?", "code": null, "opts": ["geom_histogram(); only x", "geom_col(); x and y", "geom_line(); x and y", "geom_histogram(); x and y"], "ans": 0, "exp": "The histogram counts rows in bins itself, so only x is mapped. geom_col() would need a precomputed y.", "d": 2}, {"id": "gg12", "topic": "gg", "type": "mc", "prompt": "Mean hours by weekly RANK 1 to 10. Which geoms?", "code": null, "opts": ["geom_line() + geom_point()", "geom_histogram()", "geom_col() only, with fill", "geom_boxplot()"], "ans": 0, "exp": "Rank is ordered, so the path from one rank to the next is the story: geom_line() connects, geom_point() marks each rank. Both share the aes() inside ggplot().", "d": 2}, {"id": "gg13", "topic": "gg", "type": "mc", "prompt": "Which geom for two numeric columns, one dot per row (danceability vs energy for 1,037 tracks)?", "code": null, "opts": ["geom_point()", "geom_col()", "geom_line()", "geom_histogram()"], "ans": 0, "exp": "One dot per row on two numeric axes is a scatterplot.", "d": 2}, {"id": "gg14", "topic": "gg", "type": "mc", "prompt": "Why does geom_histogram(aes(x = hours, y = n)) fail?", "code": null, "opts": ["The histogram computes its own counts; it must have only an x or y aesthetic", "hours is not numeric", "y cannot be named n", "Histograms need color"], "ans": 0, "exp": "stat_bin() counts rows for you. Supplying your own y conflicts with that. For a precomputed height use geom_col().", "d": 2}, {"id": "gg15", "topic": "gg", "type": "mc", "prompt": "What is the difference between + and |> in plotting code?", "code": null, "opts": ["|> passes a table to the next verb; + adds a piece to a plot", "+ passes data, |> adds geoms", "They are interchangeable", "|> is only for loops"], "ans": 0, "exp": "They meet once: df |> ggplot(aes(...)) + geom_point(). Using |> between layers (|> geom_point()) tries to pass a plot as a function argument and fails.", "d": 2}, {"id": "gg16", "topic": "gg", "type": "mc", "prompt": "Where should theme(legend.position = \"bottom\") go?", "code": null, "opts": ["After a complete theme like theme_minimal()", "Before theme_minimal()", "Inside aes()", "Inside geom_col()"], "ans": 0, "exp": "A complete theme resets all theme settings. Add your tweak after it, or theme_minimal() overwrites it.", "d": 2}, {"id": "gg17", "topic": "gg", "type": "mc", "prompt": "Two players' mean points per division are drawn with fill = player. To put the bars side by side, add:", "code": null, "opts": ["geom_col(position = \"dodge\")", "geom_col(fill = \"dodge\")", "scale_fill_dodge()", "theme(position = \"dodge\")"], "ans": 0, "exp": "Mapped fill stacks by default for geom_col(); position = \"dodge\" places the bars beside each other.", "d": 2}, {"id": "gg18", "topic": "gg", "type": "mc", "prompt": "flights stacked by airport with geom_col() and fill = origin shows:", "code": null, "opts": ["Stacked bars: one bar per month, split into airport slices", "Side-by-side bars", "Three separate charts", "Lines"], "ans": 0, "exp": "geom_col() stacks mapped fills by default (position \"stack\").", "d": 2}, {"id": "gg19", "topic": "gg", "type": "mc", "prompt": "geom_histogram(binwidth = 10) on hours in millions means:", "code": null, "opts": ["Each bar covers a 10 million hour range", "There are exactly 10 bars", "Ten title-weeks per bar", "The maximum is 10"], "ans": 0, "exp": "binwidth is the width of each bin in the units of x.", "d": 2}, {"id": "gg20", "topic": "gg", "type": "mc", "prompt": "Which plot title follows the course rule?", "code": null, "opts": ["Fridays cancel the largest share of flights, Sundays the smallest", "share_cancelled by weekday", "Plot of cancellations", "Weekday on x, share on y"], "ans": 0, "exp": "A title states the finding, not the variable names. Axis labels name the variable and unit.", "d": 2}, {"id": "gg21", "topic": "gg", "type": "mc", "prompt": "Why does the Netflix line plot filter movies >= 25 before drawing means?", "code": null, "opts": ["A mean from a handful of films zig-zags and is not defensible; filtering AND saying so is honest", "The line geom needs at least 25 points", "ggplot drops groups smaller than 25", "So the legend fits"], "ans": 0, "exp": "Small groups produce noisy means. Keep the means you can defend and state the rule in the subtitle or caveat.", "d": 2}, {"id": "gg22", "topic": "gg", "type": "mc", "prompt": "geom_col(aes(color = slot)) on a bar chart changes what?", "code": null, "opts": ["Only the bar outlines; fill stays default", "The bar fill", "The axis", "Nothing"], "ans": 0, "exp": "Bars are filled shapes: fill colors the inside, color colors the outline. Use fill for bar colors.", "d": 2}, {"id": "gg23", "topic": "gg", "type": "mc", "prompt": "What does labs(x = NULL) do?", "code": null, "opts": ["Removes the x-axis title", "Sets the x axis to zero", "Hides the x axis labels and ticks", "Errors"], "ans": 0, "exp": "NULL removes the axis title (useful when the tick labels already say it, like months).", "d": 2}, {"id": "gg24", "topic": "gg", "type": "mc", "prompt": "One title over time (Squid Game weekly hours), one color needed. Where does the color go?", "code": null, "opts": ["Outside aes(), as geom_line(color = lab_red)", "Inside aes(), as aes(color = lab_red)", "In labs()", "In theme()"], "ans": 0, "exp": "One series needs no legend, so the color is a constant set outside aes().", "d": 2}, {"id": "gg25", "topic": "gg", "type": "mc", "prompt": "Which spelling is used from week 7 on?", "code": null, "opts": ["flights_df |> ggplot(aes(x = date, y = n)) + geom_line()", "ggplot(flights_df) + aes(date, n) |> geom_line()", "flights_df + ggplot(aes(date, n))", "ggplot() |> data(flights_df)"], "ans": 0, "exp": "The table enters the plot through the pipe like every other verb; the plot pieces are joined with +.", "d": 2}, {"id": "gg26", "topic": "gg", "type": "dims", "prompt": "nflx_df is read from nflx_top10.csv (1,440 rows x 8 columns) and given hours_millions. After tv_english_df <- nflx_df |> filter(category == \"TV (English)\"), how many rows and columns?", "code": null, "ans": [360, 9], "exp": "36 weeks x 10 ranks = 360 rows. filter() never drops columns: 8 + hours_millions = 9.", "d": 2}, {"id": "gg27", "topic": "gg", "type": "dims", "prompt": "type_week_df is built with fct_collapse() (four lists into Films and TV), then group_by(week, type) |> summarize(total_hours = sum(hours_millions)). How many rows and columns?", "code": null, "ans": [72, 3], "exp": "36 weeks x 2 types = 72 rows; columns week, type, total_hours.", "d": 2}, {"id": "gg28", "topic": "gg", "type": "dims", "prompt": "rank_df: one row per weekly rank with mean hours (nflx_df |> group_by(weekly_rank) |> summarize(mean_hours = ...)). Rows x columns?", "code": null, "ans": [10, 2], "exp": "Ranks 1 to 10 give 10 rows; columns weekly_rank and mean_hours.", "d": 2}, {"id": "gg29", "topic": "gg", "type": "mc", "prompt": "category_df has 4 rows (one per Top 10 list). Which geom, and is the fill mapped or set when every bar is the same blue?", "code": null, "opts": ["geom_col(); set outside aes()", "geom_histogram(); mapped", "geom_col(); mapped", "geom_point(); set"], "ans": 0, "exp": "A summary table of category + number is a geom_col(). One shared color is a constant, so it goes outside aes().", "d": 2}, {"id": "gg30", "topic": "gg", "type": "mc", "prompt": "A legend appears on your plot but you wanted all points one color. Most likely cause?", "code": null, "opts": ["The color was written inside aes()", "labs() was added", "theme_minimal() was used", "geom_point() was used"], "ans": 0, "exp": "Mappings inside aes() build legends. Move constants outside aes().", "d": 2}, {"id": "gg31", "topic": "gg", "type": "mc", "prompt": "year_summary_df is group_by(audience, release_year) with 4 audiences and 11 years (2010 to 2020). It has fewer than 44 rows. Why?", "code": null, "opts": ["group_by() makes rows only for combinations that appear in the data", "summarize() drops one group", "filter removed years", "11 x 4 is not 44"], "ans": 0, "exp": "A group exists only when at least one row falls in it. Missing audience-year combinations are simply absent, not zero.", "d": 2}, {"id": "scale01", "topic": "scale", "type": "mc", "prompt": "What is the naming rule for scale functions?", "code": null, "opts": ["scale_ + the aesthetic + the kind of data", "scale_ + the geom + the theme", "the data type + _scale", "scale() + the variable name"], "ans": 0, "exp": "scale_x_date(), scale_y_continuous(), scale_x_continuous(), scale_color_manual() ...", "d": 2}, {"id": "scale02", "topic": "scale", "type": "mc", "prompt": "A Date column is on the x axis. Which function sets monthly ticks labelled Jan, Feb, ...?", "code": null, "opts": ["scale_x_date(date_breaks = \"1 month\", date_labels = \"%b\")", "scale_x_continuous(breaks = \"month\")", "scale_x_date(breaks = seq(1, 12))", "scale_x_month()"], "ans": 0, "exp": "scale_x_date() has date_breaks and date_labels. %b is the abbreviated month name.", "d": 2}, {"id": "scale03", "topic": "scale", "type": "mc", "prompt": "hour is a NUMBER (6 to 21). Which gets a tick every 3 hours?", "code": null, "opts": ["scale_x_continuous(breaks = seq(6, 21, by = 3))", "scale_x_date(date_breaks = \"3 hours\")", "scale_x_hour(by = 3)", "scale_y_continuous(breaks = 3)"], "ans": 0, "exp": "Numbers on x use scale_x_continuous(); date_breaks is for Dates only.", "d": 2}, {"id": "scale04", "topic": "scale", "type": "num", "prompt": "How many ticks does scale_x_continuous(breaks = seq(6, 21, by = 3)) place?", "code": null, "ans": 6, "tol": 0, "exp": "seq(6, 21, by = 3) is 6 9 12 15 18 21: six values.", "d": 2, "unit": null}, {"id": "scale05", "topic": "scale", "type": "num", "prompt": "How many ticks does scale_y_continuous(breaks = seq(0, 35, by = 5)) place?", "code": null, "ans": 8, "tol": 0, "exp": "0 5 10 15 20 25 30 35: eight values.", "d": 2, "unit": null}, {"id": "scale06", "topic": "scale", "type": "num", "prompt": "How many ticks does breaks = seq(0, 80, by = 40) place?", "code": null, "ans": 3, "tol": 0, "exp": "0, 40 and 80. It changes only the axis; the line is the data.", "d": 2, "unit": null}, {"id": "scale07", "topic": "scale", "type": "mc", "prompt": "In scale_y_continuous, what do breaks, limits and labels control?", "code": null, "opts": ["breaks: where ticks go; limits: where the axis starts and stops; labels: what the ticks say", "breaks: the labels; limits: tick positions; labels: the title", "all three set the same thing", "breaks: colors"], "ans": 0, "exp": "Remember: where, how far, what it says.", "d": 2}, {"id": "scale08", "topic": "scale", "type": "mc", "prompt": "scale_y_continuous(limits = c(0, 35)) is used and two data points fall below 0. What happens?", "code": null, "opts": ["Those rows are dropped from the plot with a warning", "The axis stretches to fit them", "They are clamped to 0", "An error"], "ans": 0, "exp": "A limits setting that cuts off data drops those rows (with a warning). The scale changes how values are read, never the values, unless limits removes them.", "d": 2}, {"id": "scale09", "topic": "scale", "type": "mc", "prompt": "Which label code gives the weekday abbreviation (Mon, Tue...) in date_labels?", "code": null, "opts": ["%a", "%b", "%d", "%Y"], "ans": 0, "exp": "%a weekday abbreviation, %b month abbreviation, %B month name, %d day of month, %Y four-digit year.", "d": 2}, {"id": "scale10", "topic": "scale", "type": "mc", "prompt": "scale_y_continuous(labels = label_percent()) is applied to a column holding 0.032. What does the tick read?", "code": null, "opts": ["3.2%", "0.032%", "32%", "320%"], "ans": 0, "exp": "label_percent() multiplies a PROPORTION by 100 and adds %. Giving it 3.2 (already a percent) would read 320%.", "d": 2}, {"id": "scale11", "topic": "scale", "type": "mc", "prompt": "scale_y_continuous(labels = label_comma()) shows 25000 as:", "code": null, "opts": ["25,000", "25.000", "2.5e4", "$25,000"], "ans": 0, "exp": "label_comma() from the scales package adds thousands separators.", "d": 2}, {"id": "scale12", "topic": "scale", "type": "mc", "prompt": "Why are the parentheses needed in labels = label_comma()?", "code": null, "opts": ["labels = wants the function that label_comma() returns", "They are optional style", "They convert to text", "They set the number of digits"], "ans": 0, "exp": "label_comma() is a function that BUILDS a labelling function. The scale needs the built function.", "d": 2}, {"id": "scale13", "topic": "scale", "type": "mc", "prompt": "Colors are chosen for a MAPPED color aesthetic. What is the right form?", "code": null, "opts": ["scale_color_manual(values = c(EWR = \"#1f5f8b\", JFK = \"#c0392b\", LGA = \"#0f8b8d\"))", "scale_color_manual(c(\"red\", \"blue\"))", "scale_x_manual(values = ...)", "aes(color = c(EWR = ...))"], "ans": 0, "exp": "A NAMED vector whose names match the levels in the data.", "d": 2}, {"id": "scale14", "topic": "scale", "type": "mc", "prompt": "Bars map fill = origin but you wrote scale_color_manual(values = airport_colors). What happens?", "code": null, "opts": ["No error and no colors: the scale name must match the mapped aesthetic", "A red error", "The bars turn the right colors", "The outlines change"], "ans": 0, "exp": "A mismatched scale is silently ignored. Bars use fill, so scale_fill_manual().", "d": 2}, {"id": "scale15", "topic": "scale", "type": "mc", "prompt": "Airline colors are mapped by name (full airline names). What must the names of the named vector be?", "code": null, "opts": ["The full names that appear in the name column", "The two-letter carrier codes", "Any labels", "The row numbers"], "ans": 0, "exp": "Names must match the LEVELS of the mapped column. Because name (not carrier) was mapped to color, use full names.", "d": 2}, {"id": "scale16", "topic": "scale", "type": "mc", "prompt": "Which line puts a monthly summary on a date axis AND keeps a real Date?", "code": null, "opts": ["mutate(month_start = floor_date(date, \"month\"))", "mutate(month_start = month(date, label = TRUE))", "mutate(month_start = month(date))", "mutate(month_start = as.character(date))"], "ans": 0, "exp": "floor_date() rounds down and stays a Date. month(label = TRUE) gives a factor (good for a table); month() a number.", "d": 2}, {"id": "scale17", "topic": "scale", "type": "mc", "prompt": "Why does floor_date(date, \"week\") give 53 groups for 2013?", "code": null, "opts": ["Weeks start on Sunday and Jan 1 2013 was a Tuesday, so partial weeks at both ends make 53", "Years have 53 weeks", "There are leap weeks", "ggplot adds a week"], "ans": 0, "exp": "The first 'week' starts 2012-12-30 and holds only two days. A partial week at each end is the price of keeping a real Date.", "d": 2}, {"id": "scale18", "topic": "scale", "type": "mc", "prompt": "month_start = floor_date(date, \"month\"), grouped with origin. How many rows for 3 airports and 12 months?", "code": null, "opts": ["36", "3", "12", "15"], "ans": 0, "exp": "3 x 12 = 36 groups, each with at least one flight.", "d": 2}, {"id": "scale19", "topic": "scale", "type": "mc", "prompt": "If you put month(date, label = TRUE) (a factor) on scale_x_date(), what happens?", "code": null, "opts": ["Error: the scale needs a Date", "It works the same", "Only numbers are shown", "The factor is converted silently"], "ans": 0, "exp": "scale_x_date() needs a Date. Use floor_date() for an axis and month(label = TRUE) for a table label.", "d": 2}, {"id": "scale20", "topic": "scale", "type": "mc", "prompt": "Why did the weekday bar chart show Sun to Sat with NO scale?", "code": null, "opts": ["weekday is a factor from wday(label = TRUE) with levels in calendar order", "ggplot sorts weekday names", "scale_x_discrete was applied", "Sunday is alphabetically first"], "ans": 0, "exp": "The factor levels order the discrete axis.", "d": 2}, {"id": "scale21", "topic": "scale", "type": "mc", "prompt": "Which call writes a data frame to a CSV?", "code": null, "opts": ["write_csv(flights_df, \"Data/nyc_flights_2013.csv\")", "write_csv(\"Data/x.csv\", flights_df)", "save(flights_df, csv)", "read_csv(flights_df)"], "ans": 0, "exp": "First argument is the table, second is the path. It silently replaces a same-named file.", "d": 2}, {"id": "scale22", "topic": "scale", "type": "mc", "prompt": "write_xlsx(list(flights = flights_df, airports = airports_df), \"x.xlsx\") creates:", "code": null, "opts": ["One workbook with two sheets named flights and airports", "Two files", "One sheet", "An error"], "ans": 0, "exp": "A named list of tables becomes one sheet each. write_xlsx() is from writexl.", "d": 2}, {"id": "scale23", "topic": "scale", "type": "mc", "prompt": "After write_csv(flights_df, ...) and read_csv(), the dimensions printed are 336776 23. What does that confirm?", "code": null, "opts": ["The same dimensions as the table written", "The factor columns survived", "The file is 23 MB", "Cancelled flights were dropped"], "ans": 0, "exp": "Dimensions match; but factor columns (month_name, weekday) come back as text.", "d": 2}, {"id": "scale24", "topic": "scale", "type": "mc", "prompt": "Why is theme(legend.position = \"bottom\") often added in the flights plots?", "code": null, "opts": ["It is a theme tweak that moves the legend below the plot", "It changes the data", "It reorders the legend", "It is required by scale_color_manual"], "ans": 0, "exp": "Legend position is a theme setting, and goes after the complete theme.", "d": 2}, {"id": "scale25", "topic": "scale", "type": "mc", "prompt": "What does date_labels = \"%B\" print for the date 2013-01-05?", "code": null, "opts": ["January", "Jan", "01", "2013"], "ans": 0, "exp": "%B is the full month name; %b the abbreviation; %m would give 01; %Y the year.", "d": 2}, {"id": "scale26", "topic": "scale", "type": "mc", "prompt": "A tick every two weeks on a date axis is:", "code": null, "opts": ["date_breaks = \"2 weeks\"", "breaks = 2", "date_breaks = 14", "date_labels = \"2 weeks\""], "ans": 0, "exp": "date_breaks accepts text like \"1 month\", \"2 weeks\", \"1 year\".", "d": 2}, {"id": "scale27", "topic": "scale", "type": "mc", "prompt": "What does date_labels = \"%b %d\" print for 2013-01-05?", "code": null, "opts": ["Jan 05", "January 5", "05 Jan", "2013 Jan"], "ans": 0, "exp": "%b = Jan, a space, %d = day with a leading zero: Jan 05.", "d": 2}, {"id": "join01", "topic": "join", "type": "mc", "prompt": "Which join keeps EVERY row of x and fills NA where y has no partner?", "code": null, "opts": ["left_join(x, y)", "inner_join(x, y)", "semi_join(x, y)", "anti_join(x, y)"], "ans": 0, "exp": "left_join() never drops x rows (when y has one row per key): it looks up y's columns and fills NA when there is no match.", "d": 2}, {"id": "join02", "topic": "join", "type": "mc", "prompt": "Which join returns the rows of x that have NO partner in y, with only x's columns?", "code": null, "opts": ["anti_join(x, y)", "semi_join(x, y)", "left_join(x, y)", "full_join(x, y)"], "ans": 0, "exp": "anti_join() is the smoke detector: rows of x with no match, no y columns.", "d": 2}, {"id": "join03", "topic": "join", "type": "mc", "prompt": "Which join returns x's rows that DO have a match in y, never duplicates them, and adds no columns?", "code": null, "opts": ["semi_join(x, y)", "inner_join(x, y)", "right_join(x, y)", "bind_rows(x, y)"], "ans": 0, "exp": "semi_join() is a filter, not a merge. inner_join() also adds y's columns and duplicates x rows if y repeats a key.", "d": 2}, {"id": "join04", "topic": "join", "type": "mc", "prompt": "right_join(x, y) gives the same ROWS as which call?", "code": null, "opts": ["left_join(y, x)", "left_join(x, y)", "inner_join(x, y)", "full_join(y, x)"], "ans": 0, "exp": "The mirror image. Only the column order differs.", "d": 2}, {"id": "join05", "topic": "join", "type": "mc", "prompt": "Which statement about bind_cols() is correct?", "code": null, "opts": ["It pairs rows by POSITION only; if the rows are in the wrong order it gives wrong data with no error", "It matches rows by a key column", "It errors if the column names differ", "It always drops unmatched rows"], "ans": 0, "exp": "No key is checked. Different row counts error (good); same counts in the wrong order silently pair the wrong rows (bad).", "d": 2}, {"id": "join06", "topic": "join", "type": "mc", "prompt": "bind_rows(a, b): a has columns id, x; b has columns id, x, producer. What happens?", "code": null, "opts": ["No error; producer is kept and is NA for the rows that came from a", "An error: column mismatch", "producer is dropped", "The tables are joined by id"], "ans": 0, "exp": "bind_rows() matches columns BY NAME and fills NA when a column exists in only one table.", "d": 2}, {"id": "join07", "topic": "join", "type": "mc", "prompt": "A lookup table has TWO rows for Taylor Swift. Taylor has 530 tracks in the left table. What happens in a left join?", "code": null, "opts": ["Each Taylor track is duplicated (530 becomes 1,060) with no error", "dplyr raises an error", "Only one row per track is kept", "Taylor tracks become NA"], "ans": 0, "exp": "When a key repeats in y, every matching x row is duplicated. A lookup should have one row per key: check with count(key).", "d": 2}, {"id": "join08", "topic": "join", "type": "num", "prompt": "four_df has 1,037 rows; 530 are Taylor Swift. The lookup accidentally lists Taylor TWICE (all other artists once). How many rows does a left_join() return?", "code": null, "ans": 1567, "tol": 0, "exp": "530 Taylor tracks each match two lookup rows: +530. 1,037 + 530 = 1,567.", "d": 2, "unit": null}, {"id": "join09", "topic": "join", "type": "mc", "prompt": "Why should you write by = every time?", "code": null, "opts": ["dplyr otherwise guesses all shared column names, and a coincidence like two columns called name silently breaks the join", "by = speeds up the join", "Without by = R errors", "by = removes duplicates"], "ans": 0, "exp": "dplyr prints 'Joining with by = join_by(...)' and often guesses right, but not when unrelated columns share a name.", "d": 2}, {"id": "join10", "topic": "join", "type": "mc", "prompt": "What does by = c(\"dest\" = \"faa\") mean?", "code": null, "opts": ["My dest column equals their faa column", "dest and faa are both added", "faa is renamed to dest before the join", "Join on every shared column"], "ans": 0, "exp": "Left name is in x, right name is in y. The result keeps x's name (dest).", "d": 2}, {"id": "join11", "topic": "join", "type": "mc", "prompt": "anti_join(flights_df, airlines_df, by = \"carrier\") returns 0 rows. What does that prove?", "code": null, "opts": ["Every carrier code has a partner in the lookup, so the left join will have no NA", "The tables are empty", "The join failed", "The lookup has duplicates"], "ans": 0, "exp": "Zero rows from the smoke detector means every key matched.", "d": 2}, {"id": "join12", "topic": "join", "type": "mc", "prompt": "Which situation needs a join on TWO key columns?", "code": null, "opts": ["season_7 exists for Kobe, LeBron AND Jordan, and an awards table lists MVP seasons", "A lookup of team codes", "A single list of players", "Two tables with identical rows"], "ans": 0, "exp": "Only Name AND Season together identify one player's season. Joining on Season alone attaches the award to every player's season_7.", "d": 2}, {"id": "join13", "topic": "join", "type": "mc", "prompt": "mvp_df has season_7 twice (LJ and MJ). left_join(goats_df, mvp_df, by = \"Season\") instead of by = c(\"Name\", \"Season\"). What is true?", "code": null, "opts": ["The result has MORE than 3,400 rows and awards attach to the wrong players", "It still has 3,400 rows", "It errors", "Only LeBron's games change"], "ans": 0, "exp": "Each season_7 game matches two mvp rows, so it is duplicated. Every player's games in an MVP season number are mislabelled MVP.", "d": 2}, {"id": "join14", "topic": "join", "type": "mc", "prompt": "After left_join(visits_df, majors_df) the major column is NA for s04, and you group_by(major) |> summarize(...). How many groups does the NA form?", "code": null, "opts": ["Its own group: NA is kept as a group", "It is dropped", "It merges with the smallest group", "It errors"], "ans": 0, "exp": "group_by() makes NA its own group, so the summary has an extra row. That is why 2 majors + NA gives 3 rows.", "d": 2}, {"id": "join15", "topic": "join", "type": "mc", "prompt": "A student s05 appears in majors_df but in none of the visits. In left_join(visits_df, majors_df), where is s05?", "code": null, "opts": ["Nowhere in the result", "As a row of NAs", "As the last row", "In the first row"], "ans": 0, "exp": "A left join only looks up the left table's rows. A full_join or right_join would show s05.", "d": 2}, {"id": "join16", "topic": "join", "type": "mc", "prompt": "In the Spotify notes, which of the four artists disappears after inner_join(four_df, artist_info_df)?", "code": null, "opts": ["Drake: missing from the lookup, so his 308 tracks vanish", "Taylor Swift", "Kendrick Lamar", "Billie Eilish"], "ans": 0, "exp": "Drake is in four_df but not in the deliberate

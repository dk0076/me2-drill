rmation key is duplicated for a few ids. What happens and what is your check?", "code": null, "opts": ["Response rows are multiplied silently; compare row counts before and after (and confirm the key is unique first)", "dplyr warns you", "The join drops those ids", "Nothing"], "ans": 0, "exp": "When the response side is unique, dplyr gives no warning on a duplicated lookup key. Row counts are the check.", "d": 2}, {"id": "join38", "topic": "join", "type": "mc", "prompt": "Which single function most directly does this job?\nEvery student on the roster, with their quiz score where they took the quiz and NA where they did not. x = roster_df, y = quiz_df.", "code": null, "opts": ["bind_rows()", "left_join()", "anti_join()", "bind_cols()"], "ans": 1, "exp": "Keep every row of x and look up y's column: left_join. Students with no quiz get NA.", "d": 2}, {"id": "join39", "topic": "join", "type": "mc", "prompt": "Which single function most directly does this job?\nOnly the products that have at least one order, with the product table's columns only. x = products_df, y = orders_df (orders repeat products).", "code": null, "opts": ["full_join()", "inner_join()", "bind_rows()", "semi_join()"], "ans": 3, "exp": "A filter by partner: semi_join keeps x's matching rows once each and adds no columns.", "d": 2}, {"id": "join40", "topic": "join", "type": "mc", "prompt": "Which single function most directly does this job?\nCustomers who have never placed an order. x = customers_df, y = orders_df.", "code": null, "opts": ["right_join()", "inner_join()", "anti_join()", "bind_rows()"], "ans": 2, "exp": "x rows with no partner in y and only x's columns.", "d": 2}, {"id": "join41", "topic": "join", "type": "mc", "prompt": "Which single function most directly does this job?\nEveryone who appears in the fall roster OR the spring roster, with both dues columns and NA where absent. x = fall_df, y = spring_df.", "code": null, "opts": ["bind_rows()", "semi_join()", "bind_cols()", "full_join()"], "ans": 3, "exp": "Keep all rows of both tables.", "d": 2}, {"id": "join42", "topic": "join", "type": "mc", "prompt": "Which single function most directly does this job?\nTwo weekly receipt tables with the same columns stacked into one table.", "code": null, "opts": ["bind_cols()", "inner_join()", "bind_rows()", "full_join()"], "ans": 2, "exp": "Same variables, different observations: stack. Nothing is matched.", "d": 2}, {"id": "join43", "topic": "join", "type": "mc", "prompt": "Which single function most directly does this job?\nAdd each game's opponent city to every game; games against unknown opponents must stay. x = games_df, y = opp_df.", "code": null, "opts": ["left_join()", "semi_join()", "bind_rows()", "full_join()"], "ans": 0, "exp": "Every row of x must survive.", "d": 2}, {"id": "join44", "topic": "join", "type": "mc", "prompt": "Which single function most directly does this job?\nOnly the tutoring students, with name from one table and hours from another, both present in both tables.", "code": null, "opts": ["bind_rows()", "semi_join()", "left_join()", "inner_join()"], "ans": 3, "exp": "Matches only, with columns from both.", "d": 2}, {"id": "join45", "topic": "join", "type": "mc", "prompt": "Which single function most directly does this job?\nTwo halves of one gradebook export verified to be in the same row order, no shared key column.", "code": null, "opts": ["right_join()", "bind_rows()", "left_join()", "bind_cols()"], "ans": 3, "exp": "No key exists, rows are aligned: glue by position (only safe because order was verified).", "d": 2}, {"id": "join46", "topic": "join", "type": "mc", "prompt": "Which single function most directly does this job?\nBefore joining, find which tracks would end up with NA genre after a left join.", "code": null, "opts": ["semi_join()", "bind_rows()", "left_join()", "anti_join()"], "ans": 3, "exp": "The smoke detector returns exactly the rows a left_join would fill with NA.", "d": 2}, {"id": "join47", "topic": "join", "type" onses should be:", "code": null, "opts": ["Excluded from analysis (counting how many), and if voided is missing, flagged and a decision documented", "Kept and counted as incorrect", "Silently dropped", "Treated as correct"], "ans": 0, "exp": "Report total, voided and remaining. Unknown validity must not be silently treated as valid.", "d": 2}, {"id": "tz09", "topic": "tz", "type": "num", "prompt": "A topic has 20 valid responses: 12 correct, 3 incorrect, 5 with unknown outcome (NA). What is its accuracy (as a proportion)?", "code": null, "ans": 0.8, "tol": 0.001, "exp": "The denominator is KNOWN outcomes: 12 / (12 + 3) = 0.8. Treating NA as wrong would give 0.6.", "d": 2, "unit": null}, {"id": "tz10", "topic": "tz", "type": "mc", "prompt": "A topic has 6 valid responses and all 6 have unknown outcomes. Its accuracy is:", "code": null, "opts": ["Unavailable", "0", "1", "NA means 0"], "ans": 0, "exp": "A group with no known outcomes is reported as unavailable, not zero.", "d": 2}, {"id": "tz11", "topic": "tz", "type": "mc", "prompt": "A topic percentage rests on 4 responses. How do you treat it in a study decision?", "code": null, "opts": ["Show the denominator and call it weak evidence", "Trust it, since percentages are exact", "Drop the topic silently", "Round it up"], "ans": 0, "exp": "Small groups make percentages noisy. Show counts beside accuracy.", "d": 2}, {"id": "tz12", "topic": "tz", "type": "mc", "prompt": "The simulated Lab 8 files cover nine local dates and three Monday-start weeks (two partial). What does 'over time' mean here?", "code": null, "opts": ["Across those dates only; do not describe a term-long trend", "A trend across the semester", "A year-over-year change", "Nothing can be said"], "ans": 0, "exp": "Say what the data cover. Partial edge weeks must be labelled before you compare weeks.", "d": 2}, {"id": "tz13", "topic": "tz", "type": "mc", "prompt": "Each response row has a question_id. Which statement is a correct reading of the Lab 8 unit of observation?", "code": null, "opts": ["One row is one question answered; the question table has one served question per row", "One row is one session", "One row is one topic", "One row is one student"], "ans": 0, "exp": "Lab 4 used sessions. Lab 8 uses answered questions, plus a separate table describing the served questions.", "d": 2}, {"id": "tz14", "topic": "tz", "type": "mc", "prompt": "Which would be a reasonable way to flag 'unmatched question IDs' after the left join?", "code": null, "opts": ["Count responses where the joined metadata is NA and separate that from topic values that are NA in the question table", "Drop them", "Replace NA topics with 'Other' silently", "Use inner_join"], "ans": 0, "exp": "Unmatched IDs and missing topic values are different problems. Report both; keep unmatched responses in overall activity.", "d": 2}, {"id": "found01", "topic": "found", "type": "mc", "prompt": "What does class(5.45 > 4.75) return?", "code": null, "opts": ["\"logical\"", "\"numeric\"", "\"character\"", "\"integer\""], "ans": 0, "exp": "A comparison returns TRUE or FALSE: a logical.", "d": 2}, {"id": "found02", "topic": "found", "type": "mc", "prompt": "What does class(38L) return?", "code": null, "opts": ["\"integer\"", "\"numeric\"", "\"double\"", "\"character\""], "ans": 0, "exp": "The L suffix makes a whole-number integer.", "d": 2}, {"id": "found03", "topic": "found", "type": "mc", "prompt": "What does c(\"a\", 1) print?", "code": null, "opts": ["\"a\" \"1\"", "\"a\" 1", "a 1", "An error"], "ans": 0, "exp": "A vector holds one type; R coerces the number to text.", "d": 2}, {"id": "found04", "topic": "found", "type": "mc", "prompt": "What is class(c(4.75, \"five\", 5.95))?", "code": null, "opts": ["\"character\"", "\"numeric\"", "\"list\"", "\"logical\""], "ans": 0, "exp": "One text value forces the whole vector to character.", "d": 2}, {"id": "found05", "topic": "found", "type": "mc", "prompt": "What does class(Sys.Date() + 7) return?", "code": null, "opts": ["\"Date\"", "\"numeric\"", "\"character\"", "\"difftime\""], "ans": 0, "exp": "A Date plus a number is a Date.", "d": 2}, {"id": "found06", "topic": "found", "type": "mc", "prompt": "After closing Positron and reopening it tomorrow, which line must you re-run: install.packages(\"tidyverse\") or library(tidyverse)?", "code": null, "opts": ["library(tidyverse): install writes to disk and persists; library loads into the session's memory, which is wiped", "install.packages(): packages vanish when Positron closes", "Both", "Neither"], "ans": 0, "exp": "Install once per computer; library once per session.", "d": 2}, {"id": "found07", "topic": "found", "type": "mc", "prompt": "What is wrong with this code?", "code": "ocean <- tibble{\n  zone = vector(\"surface\", \"shallow\", \"deep\"),\n  depth_m = vector(0, 5),\n  temp_c = vector(19, 16, 12)\n}", "opts": ["tibble uses parentheses not braces; vector() should be c(); depth_m is missing a third value", "Nothing", "tibble needs quotes", "Columns can have different lengths"], "ans": 0, "exp": "Three bugs: tibble(), c(), and equal column lengths.", "d": 2}, {"id": "found08", "topic": "found", "type": "mc", "prompt": "tibble(a = c(1, 2, 3), b = c(1, 2)) does what?", "code": null, "opts": ["Errors: columns must have compatible sizes", "Recycles b", "Fills NA", "Drops the third row"], "ans": 0, "exp": "Only length-1 inputs recycle. A length-2 column against length 3 is an error.", "d": 2}, {"id": "found09", "topic": "found", "type": "mc", "prompt": "read_excel(\"Data/nba_goats.xlsx\") with no sheet = argument reads:", "code": null, "opts": ["The first sheet (KB, Kobe's 1,156 games)", "All sheets merged", "The last sheet", "LJ, because the object is named lj_df"], "ans": 0, "exp": "The workbook's sheets are KB, LJ, MJ, variable_names, divisions. The object name changes nothing; use sheet = \"LJ\".", "d": 2}, {"id": "found10", "topic": "found", "type": "num", "prompt": "A CSV is about 120 KB. Using 1 MB = 1,000 KB and 1 GB = 1, rating in the Netflix notes (movies_df)?", "code": null, "ans": 5, "tol": 0, "exp": "The notes drop the 5 films whose rating was never recorded, and say so.", "d": 2, "unit": null}, {"id": "facts18", "topic": "facts", "type": "mc", "prompt": "Netflix titles has 7,787 rows. Which statement is true about this file?", "code": null, "opts": ["It has no information about viewers, only about titles", "It has viewing hours per title", "It has viewer ages", "It includes weekly ranks"], "ans": 0, "exp": "The file is the Netflix catalogue as of January 2021: type, title, country, date_added, release_year, rating, duration.", "d": 2}, {"id": "facts19", "topic": "facts", "type": "num", "prompt": "rank_df has one row per weekly rank in the Netflix Top 10 lab. How many rows?", "code": null, "ans": 10, "tol": 0, "exp": "Ranks 1 to 10.", "d": 2, "unit": null}, {"id": "facts20", "topic": "facts", "type": "mc", "prompt": "Which midterm facts are right? ME2 is on:", "code": null, "opts": ["Wed Oct 21, 2026, 70 minutes, one-sided 8.5 x 11 reference sheet", "Mon Oct 19, 80 minutes", "Wed Oct 21, 70 minutes, open notes", "Fri Oct 23, 70 minutes"], "ans": 0, "exp": "ME2: Wednesday of week 9, Oct 21, 2026. Cumulative weeks 1 to 8 with emphasis on 5 to 8. One 8.5 x 11 sheet, one side, prepared in advance.", "d": 2}, {"id": "sample01", "topic": "sample", "type": "multi", "prompt": "flights_df is shown in full. A cancelled flight is a row with NA in dep_delay. Select ALL expressions whose result is the number 3 (the number itself, or a one-cell table holding 3).", "code": "flights_df\nflight  carrier  dep_delay\n201     UA       8\n202     B6       NA\n203     UA       0\n204     EV       NA\n205     B6       -5\n206     UA       NA", "opts": ["flights_df |> summarize(n = sum(is.na(dep_delay)))", "flights_df |> filter(dep_delay > 0) |> nrow()", "flights_df |> filter(is.na(dep_delay)) |> nrow()", "flights_df |> count(carrier) |> nrow()", "flights_df |> summarize(m = mean(dep_delay, na.rm = TRUE))", "flights_df |> filter(dep_delay >= 0) |> nrow()"], "ans": [0, 2, 3], "exp": "Three NA rows (a and c). Three carriers: UA, B6, EV (d). filter(dep_delay > 0) keeps only 8 (1 row); the mean of 8, 0, -5 is 1; dep_delay >= 0 keeps 8 and 0 (2 rows). filter() always drops NA rows.", "d": 3}, {"id": "sample02", "topic": "sample", "type": "multi", "prompt": "sales1_df and sales2_df are shown in full. sales2_df lists its columns in a different order and has an extra column. Select ALL statements that are true.", "code": "sales1_df                    sales2_df\nstall     item    sales      sales  item     stall     cashier\nTalley    nuts    90         130    berries  Cal Poly  Jo\nRutiz     greens  55         75     nuts     Talley    Li\nCal Poly  honey   110", "opts": ["bind_rows(sales1_df, sales2_df) has 5 rows and 4 columns.", "In bind_rows(sales1_df, sales2_df), cashier is NA for the three rows from sales1_df.", "bind_rows(sales1_df, sales2_df) errors because the columns are in a different order.", "bind_cols(sales1_df, sales2_df) errors because 3 rows and 2 rows cannot be glued side by side.", "bind_rows(sales1_df, sales2_df) |> filter(sales >= 100) |> nrow() returns 3.", "bind_rows(sales2_df, sales1_df) also has 5 rows and 4 columns."], "ans": [0, 1, 3, 5], "exp": "bind_rows matches columns by name (order irrelevant) and fills NA for a column that exists in only one table. bind_cols needs equal row counts. sales >= 100 keeps 110 and 130 only: 2 rows, so the 'returns 3' statement is false.", "d": 3}, {"id": "sample03", "topic": "sample", "type": "mc", "prompt": "visits_df was imported with minutes as text because one entry reads 20 min. Select the ONE chain that makes minutes numeric with no NA so that summarize(mean_minutes = mean(minutes)) returns 36.25.", "code": "visits_df\nstudent  minutes\ns01      35\ns02      50\ns04      20 min\ns01      40", "opts": ["visits_df |> mutate(minutes = as.numeric(minutes))", "visits_df |> mutate(minutes = str_remove(minutes, \" min\"))", "visits_df |> mutate(minutes = as.numeric(str_remove(minutes, \" min\")))", "visits_df |> mutate(minutes = str_remove(as.numeric(minutes), \" min\"))", "visits_df |> mutate(minutes = str_replace(minutes, \" min\", \"0\"))"], "ans": 2, "exp": "str_remove() deletes the unit but leaves TEXT, so as.numeric() goes around it. (35 + 50 + 20 + 40) / 4 = 36.25. Converting first gives NA for the 'min' entry; str_replace to \"0\" turns 20 min into the text \"200\".", "d": 2}, {"id": "sample04", "topic": "sample", "type": "mc", "prompt": "orders_df and menu_df are shown in full. Goal: list every product in menu_df that has never been ordered, keeping only the columns of menu_df. Select the ONE chain.", "code": "menu_df             orders_df\nproduct  price      order  product\nLatte    5.5        1      Latte\nMocha    6.0        2      Latte\nChai     5.0        3      Chai", "opts": ["anti_join(menu_df, orders_df, by = \"product\")", "anti_join(orders_df, menu_df, by = \"product\")", "semi_join(menu_df, orders_df, by = \"product\")", "left_join(menu_df, orders_df, by = \"product\")", "inner_join(menu_df, orders_df, by = \"product\")"], "ans": 0, "exp": "anti_join keeps rows of the FIRST table with no partner in the second, and only the first table's columns. Here that is Mocha. Swapping the tables would ask which ORDERED products are not on the menu (none).", "d": 2}, {"id": "sample05", "topic": "sample", "type": "mc", "prompt": "date_text is stored day/month/year, so \"12/10/2026\" means 12 October 2026. R prints no error and no warning. What does game_date hold in the LAST row?", "code": "games_df\ndate_text   points\n03/09/2026  55\n10/09/2026  61\n12/10/2026  70\n\ngames_df |>\n  mutate(game_date = mdy(date_text))", "opts": ["2026-12-10", "2026-10-12", "NA, because the text does not match month/day/year", "\"12/10/2026\", unchanged, as text", "An error: mdy() needs dashes"], "ans": 0, "exp": "mdy() reads 12/10/2026 as month 12, day 10: December 10. Every value here is a valid month/day, so R accepts them silently. Use dmy().", "d": 2}, {"id": "sample06", "topic": "sample", "type": "mc", "prompt": "What does ymd_hms(\"2026-11-02 14:30\") return?", "code": null, "opts": ["NA, with a warning", "2026-11-02 14:30:00 UTC", "An error", "2026-11-02", "14:30"], "ans": 0, "exp": "The text has no seconds, so the ymd_hms pattern does not fit and the result is NA with a warning (not an error). ymd_hm() matches.", "d": 2}, {"id": "sample07", "topic": "sample", "type": "mc", "prompt": "games_df is shown in full; its rows are NOT in date order. What does count(month_name) print?", "code": "games_df\ngame_date   points\n2026-12-03  80\n2026-10-14  71\n2026-11-20  64\n2026-10-30  58\n2026-12-18  66\n2026-12-22  70\n\ngames_df |>\n  mutate(month_name = month(game_date, label = TRUE)) |>\n  count(month_name)", "opts": ["Oct 2, Nov 1, Dec 3: calendar order, because month_name is a factor with the months as levels", "Dec 3, Oct 2, Nov 1: the order the months first appear", "Dec 3, Nov 1, Oct 2: alphabetical order", "One row holding 6", "Six rows, one per game"], "ans": 0, "exp": "month(label = TRUE) returns a factor with levels in calendar order; count() follows the levels (and shows only months that occur).", "d": 2}, {"id": "sample08", "topic": "sample", "type": "num", "prompt": "Plot: scale_y_continuous(limits = c(500, 2000)). hour_df is shown in full. How many rows does ggplot remove (with a warning)?", "code": "hour_df\nhour  route  riders\n8     Pine   600\n12    Pine   2600\n16    Pine   1500\n8     Oak    450\n12    Oak    1200\n16    Oak    1900\n\nhour_df |>\n  ggplot(aes(x = hour, y = riders, color = route)) +\n  geom_line() +\n  scale_y_continuous(limits = c(500, 2000))", "ans": 2, "tol": 0, "exp": "Pine at hour 12 (2600) is above 2000 and Oak at hour 8 (450) is below 500. Rows outside limits are removed, not clamped.", "d": 2, "unit": null}, {"id": "sample09", "topic": "sample", "type": "dims", "prompt": "orders_df and promos_df are shown in full. Dimensions (rows x columns) of inner_join(orders_df, promos_df, by = \"shop\")?", "code": "orders_df             promos_df\nshop       drink      shop        promo\nScout      latte      Scout       BOGO\nScout      mocha      Julian's    Student10\nJulian's   drip       Julian's    BOGO\nKreuzberg  latte      BlackHorse  BOGO\nJulian's   mocha", "ans": [6, 3], "exp": "Scout: 2 orders x 1 promo = 2 rows. Julian's: 2 orders x 2 promos = 4 rows. Kreuzberg and BlackHorse have no partner. 6 rows; columns shop, drink, promo.", "d": 2}, {"id": "sample10", "topic": "sample", "type": "dims", "prompt": "Dimensions (rows x columns) of the table printed by this pipeline? Both tables are shown in full.", "code": "visits_df             majors_df\nstudent  minutes      student  major\ns01      45           s01      Stats\ns02      60           s02      Bio\ns01      30           s03      Bio\ns03      90           s05      Kines\ns02      40\ns06      55\n\nvisits_df |>\n  full_join(majors_df, by = \"student\") |>\n  group_by(major) |>\n  summarize(n = n(), mean_minutes = mean(minutes))", "ans": [4, 3], "exp": "full_join gives 7 rows (6 visits, s06 with no major, plus s05 with no visits). group_by(major) makes 4 groups: Stats (2 visits), Bio (3), Kines (1, mean NA), and an NA group (s06). Columns: major, n, mean_minutes.", "d": 2}, {"id": "sample11", "topic": "sample", "type": "num", "prompt": "What is the riders value in the row of month_df where month_start is 2026-09-01?", "code": "rides_df\nride_date   riders\n2026-08-30  300\n2026-09-01  410\n2026-09-14  350\n2026-09-30  500\n2026-10-01  280\n2026-10-12  330\n\nmonth_df <- rides_df |>\n  mutate(month_start = floor_date(ride_date, \"month\")) |>\n  group_by(month_start) |>\n  summarize(riders = sum(riders))", "ans": 1260, "tol": 0, "exp": "floor_date(ride_date, \"month\") puts Sep 1, 14 and 30 in September: 410 + 350 + 500 = 1,260. The Aug 30 ride rounds down to Aug 1.", "d": 2, "unit": null}, {"id": "sample12", "topic": "sample", "type": "dims", "prompt": "paid_df lists students who paid, with repeats for instalments. Dimensions (rows x columns) of inner_join(visits_df, paid_df, by = \"student\")?", "code": "visits_df             paid_df\nstudent  minutes      student\ns11      30           s11\ns12      20           s11\ns11      50           s11\ns13      40           s13\ns14      25           s15\ns12      35           s16\ns15      60", "ans": [8, 2], "exp": "s11 has 2 visits and 3 rows in paid_df: 6 rows. s13 and s15 match one row each. 8 rows; columns student and minutes (paid_df adds nothing new).", "d": 2}, {"id": "sample13", "topic": "sample", "type": "dims", "prompt": "games_df and opp_df are shown in full. Dimensions (rows x columns) of inner_join(games_df, opp_df, by = \"opp\")?", "code": "games_df                      opp_df\ngame_date   opp   points      opp   city\n2026-11-01  UCLA  70          UCLA  LA\n2026-11-03  USC   55          USC   LA\n2026-11-08  UCLA  61          UCI   Irvine\n2026-11-10  FRES  64          PEPP  Malibu\n2026-11-15  USC   59", "ans": [4, 4], "exp": "inner_join rule: rows follow the key matches; columns = 3 + 2 - 1 = 4.", "d": 2}, {"id": "sample14", "topic": "sample", "type": "dims", "prompt": "games_df and opp_df are shown in full. Dimensions (rows x columns) of full_join(games_df, opp_df, by = \"opp\")?", "code": "games_df                      opp_df\ngame_date   opp   points      opp   city\n2026-11-01  UCLA  70          UCLA  LA\n2026-11-03  USC   55          USC   LA\n2026-11-08  UCLA  61          UCI   Irvine\n2026-11-10  FRES  64          PEPP  Malibu\n2026-11-15  USC   59", "ans": [7, 4], "exp": "full_join rule: rows follow the key matches; columns = 3 + 2 - 1 = 4.", "d": 2}, {"id": "sample15", "topic": "sample", "type": "dims", "prompt": "games_df and opp_df are shown in full. Dimensions (rows x columns) of right_join(games_df, opp_df, by = \"opp\")?", "code": "games_df                      opp_df\ngame_date   opp   points      opp   city\n2026-11-01  UCLA  70          UCLA  LA\n2026-11-03  USC   55          USC   LA\n2026-11-08  UCLA  61          UCI   Irvine\n2026-11-10  FRES  64          PEPP  Malibu\n2026-11-15  USC   59", "ans": [6, 4], "exp": "right_join rule: rows follow the key matches; columns = 3 + 2 - 1 = 4.", "d": 2}, {"id": "sample16", "topic": "sample", "type": "dims", "prompt": "Same tables. Dimensions of semi_join(games_df, opp_df, by = \"opp\")?", "code": "games_df                      opp_df\ngame_date   opp   points      opp   city\n2026-11-01  UCLA  70          UCLA  LA\n2026-11-03  USC   55          USC   LA\n2026-11-08  UCLA  61          UCI   Irvine\n2026-11-10  FRES  64          PEPP  Malibu\n2026-11-15  USC   59", "ans": [4, 3], "exp": "Games with a partner (UCLA x2, USC x2): 4 rows, and only games_df's 3 columns.", "d": 2}, {"id": "sample17", "topic": "sample", "type": "open", "prompt": "Same tables. In the full_join(games_df, opp_df, by = \"opp\") result, identify every row that contains an NA. For each, give its opp value and the column(s) that hold NA.", "code": "games_df                      opp_df\ngame_date   opp   points      opp   city\n2026-11-01  UCLA  70          UCLA  LA\n2026-11-03  USC   55          USC   LA\n2026-11-08  UCLA  61          UCI   Irvine\n2026-11-10  FRES  64          PEPP  Malibu\n2026-11-15  USC   59", "ans": "FRES: city is NA (a game with no lookup row).\nUCI: game_date and points are NA (a lookup row with no games).\nPEPP: game_date and points are NA (a lookup row with no games).", "exp": "A full join keeps unmatched rows from both sides. Rows from games_df with no partner lack city; rows from opp_df with no games lack the game columns.", "d": 3}, {"id": "sample18", "topic": "sample", "type": "open", "prompt": "Goal: keep the MORNING visits that lasted 40 minutes or longer and return only student and minutes. (a) Write one pipeline starting with visits_df using exactly three function calls (use two filter() steps; & is not allowed). (b) Report the dimensions of the result and list the student in each row.", "code": "visits_df\nstudent  slot     minutes\ns21      morning  45\ns22      evening  60\ns21      evening  30\ns23      morning  90\ns24      morning  35\ns22      morning  40", "ans": "(a)\nvisits_df |>\n  filter(slot == \"morning\") |>\n  filter(minutes >= 40) |>\n  select(student, minutes)\n\n(b) 3 x 2. Rows: s21 (45), s23 (90), s22 (40).", "exp": "40 passes minutes >= 40 (the boundary is included). s21's evening visit (30) and s24's morning visit (35) are removed.", "d": 3}, {"id": "sample19", "topic": "sample", "type": "open", "prompt": "Goal: one row per stall with receipts (number of receipts) and total (sum of sales), largest total first. (a) Write one pipeline from receipts_df using at most six function calls (n(), sum() and desc() count). (b) Write out the printed table, every row and column.", "code": "receipts_df\nstall    item    sales\nTalley   nuts    85\nBudwood  plums   40\nTalley   nuts    65\nRutiz    greens  70\nBudwood  plums   55\nBudwood  honey   30\nTalley   figs    50", "ans": "(a)\nreceipts_df |>\n  group_by(stall) |>\n  summarize(receipts = n(), total = sum(sales)) |>\n  arrange(desc(total))\n\n(b)\nstall    receipts total\nTalley          3   200\nBudwood         3   125\nRutiz           1    70", "exp": "group_by + summarize creates one row per stall; arrange(desc(total)) puts Talley first. Calls: group_by, summarize, n, sum, arrange, desc = 6.", "d": 3}, {"id": "sample20", "topic": "sample", "type": "open", "prompt": "This pipeline stops with an error. (a) Name the column R cannot find and explain why it is missing at that step. (b) Rewrite it to return the NOVEMBER total. (c) Report the dimensions and value of your result.", "code": "rides_df\nride_date   riders\n2026-10-30  300\n2026-11-02  410\n2026-11-09  380\n2026-11-16  350\n2026-12-01  290\n\nrides_df |>\n  mutate(month_name = month(ride_date, label = TRUE)) |>\n  summarize(total = sum(riders)) |>\n  filter(month_name == \"Nov\")", "ans": "(a) month_name. summarize() returns only the columns it creates (total), so month_name no longer exists when filter() runs.\n\n(b)\nrides_df |>\n  mutate(month_name = month(ride_date, label = TRUE)) |>\n  filter(month_name == \"Nov\") |>\n  summarize(total = sum(riders))\n\n(c) 1 x 1 holding 1140 (410 + 380 + 350).", "exp": "Filter BEFORE summarizing, while the column still exists.", "d": 3}, {"id": "sample21", "topic": "sample", "type": "open", "prompt": "For EACH case give (i) the function you would use (bind_rows, bind_cols, or a named join with its key) and (ii) the dimensions of the correct result. For case (c) also say what bind_cols(pets_df, owners_df) would do if run directly.\n(a) all steps from both weeks in one table.\n(b) row i of mass_df and temp_df describe the same sample (confirmed). Put them side by side.\n(c) every pet in pets_df with its owner attached.", "code": "wk1_df           wk2_df\nname  steps      steps  name  day\nAna   900        800    Ana   Tue\nBen   750        950    Cruz  Tue\nCruz  1100\n\nmass_df       temp_df\nid  mass      t1  t2\na1  11        21  31\na2  12        22  32\na3  13        23  33\n\npets_df             owners_df\npet_id  weight      pet_id  owner\nP1      4.2         P3      Lee\nP2      6.8         P1      Kim\nP3      3.1         P2      Ola", "ans": "(a) bind_rows(wk1_df, wk2_df): 5 x 3 (name, steps, day; day is NA for week 1 rows).\n(b) bind_cols(mass_df, temp_df): 3 x 4.\n(c) left_join(pets_df, owners_df, by = \"pet_id\"): 3 x 3.\nbind_cols(pets_df, owners_df) runs (both have 3 rows) and glues by position: 3 x 4 with the key columns renamed pet_id...1 and pet_id...3. It pairs P1 with the owner of P3, P2 with the owner of P1, P3 with the owner of P2: wrong data, no error.", "exp": "bind_rows stacks observations (columns by name). bind_cols glues by position and is safe only when the row order is verified. A shared key means a join.", "d": 3}, {"id": "sample22", "topic": "sample", "type": "open", "prompt": "flights_df and airports_df are shown in full; the key is dest in one and faa in the other. Goal: the dest codes missing from airports_df with the number of flights to each. (a) Write one pipeline from flights_df with two function calls (anti_join and count). (b) Write the printed table. (c) A student runs left_join(flights_df, airports_df, by = c(\"dest\" = \"faa\")). Give its dimensions and the number of rows with airport NA.", "code": "flights_df        airports_df\nflight  dest      faa  airport\n301     DEN       DEN  Denver Intl\n302     ANC       SEA  Seattle Tacoma\n303     SEA       SFO  San Francisco\n304     ANC\n305     HNL", "ans": "(a)\nflights_df |>\n  anti_join(airports_df, by = c(\"dest\" = \"faa\")) |>\n  count(dest)\n\n(b)\ndest     n\nANC      2\nHNL      1\n\n(c) 5 x 3 (flight, dest, airport); 3 rows have airport NA (ANC, ANC, HNL).", "exp": "anti_join finds the unmatched flights; count() tallies them per dest (alphabetical). The left join keeps all 5 flights and adds one column.", "d": 3}, {"id": "sample23", "topic": "sample", "type": "open", "prompt": "Goal: keep only the visits by students listed in paid_df, then count visits for EACH of those students, one row per student; no visit may be counted twice. (a) Write one pipeline from visits_df with two function calls. (b) Write the printed table. (c) Why is inner_join(visits_df, paid_df, by = \"student\") the wrong first step? Give its dimensions.", "code": "visits_df             paid_df\nstudent  minutes      student\ns11      30           s11\ns12      20           s11\ns11      50           s11\ns13      40           s13\ns14      25           s15\ns12      35           s16\ns15      60", "ans": "(a)\nvisits_df |>\n  semi_join(paid_df, by = \"student\") |>\n  count(student)\n\n(b)\nstudent     n\ns11         2\ns13         1\ns15         1\n\n(c) inner_join returns 8 x 2. paid_df repeats s11 (three times), so each s11 visit is copied three times and counts would be inflated. semi_join only filters and never duplicates.", "exp": "A filter by a list uses semi_join; a repeated key in the second table only matters to joins that add columns.", "d": 3}, {"id": "sample24", "topic": "sample", "type": "open", "prompt": "day2_df lists its columns in a different order and has an extra column cashier. Goal: combine both days, keep sales of 10 dollars or more, count the retained sales for EACH stand. (a) Write one pipeline using three function calls. (b) Write the printed table. (c) What value does cashier hold for the four rows from day1_df right after combining?", "code": "day1_df             day2_df\nstand  dollars      dollars  stand  cashier\nA      12           15       B      Jo\nB      8            6        A      Li\nC      20           10       C      Li\nA      9            25       A      Jo\n                    7        B      Li", "ans": "(a)\nbind_rows(day1_df, day2_df) |>\n  filter(dollars >= 10) |>\n  count(stand)\n\n(b)\nstand     n\nA         2\nB         1\nC         2\n\n(c) NA, because day1_df has no cashier column.", "exp": "Retained: day1 A 12 and C 20; day2 B 15, C 10, A 25 (10 passes >= 10).", "d": 3}, {"id": "sample25", "topic": "sample", "type": "open", "prompt": "date_text is day/month/year text and tip_text is a date followed by hours and minutes (no seconds). (a) Write one mutate() call that adds game_date (a Date), tip_time (a date-time), weekday (name of the day) and tip_hour (hour of tip_time), using five function calls counting mutate(). (b) Report weekday and tip_hour for the row with date_text \"17/11/2026\". (c) What would ymd_hms(tip_text) return, and why?", "code": "games_df\ndate_text   tip_text          points\n06/11/2026  2026-11-06 19:00  71\n13/11/2026  2026-11-13 14:30  64\n17/11/2026  2026-11-17 19:00  80", "ans": "(a)\ngames_df |>\n  mutate(game_date = dmy(date_text),\n         tip_time  = ymd_hm(tip_text),\n         weekday   = wday(game_date, label = TRUE),\n         tip_hour  = hour(tip_time))\n\n(b) weekday Tue, tip_hour 19.\n\n(c) NA for every row (with a warning): ymd_hms() expects seconds and tip_text stops at the minutes.", "exp": "Order of letters = order of the text. 17 November 2026 is a Tuesday (Nov 2 is a Monday, plus 15 days).", "d": 3}, {"id": "sample26", "topic": "sample", "type": "open", "prompt": "Goal: one row per week with total riders, rounding each ride_date DOWN to the start of its week (weeks start on Sunday; Nov 1, 2026 is a Sunday). (a) Write one pipeline from rides_df with four function calls (floor_date() and sum() count). (b) Write the printed table. (c) Why floor_date() rather than wday() or month() with label = TRUE, if the result goes on a date axis?", "code": "rides_df\nride_date   riders\n2026-11-02  100\n2026-11-04  150\n2026-11-08  90\n2026-11-09  120\n2026-11-14  60\n2026-11-15  200", "ans": "(a)\nrides_df |>\n  group_by(week_start = floor_date(ride_date, \"week\")) |>\n  summarize(riders = sum(riders))\n\n(b)\nweek_start  riders\n2026-11-01     250\n2026-11-08     270\n2026-11-15     200\n\n(c) floor_date() returns a real Date (the Sunday starting each week), so it sorts and plots on a date axis. wday(label = TRUE) gives weekday names that pool every week together, and month(label = TRUE) gives a factor of month names: neither is a Date.", "exp": "Nov 2 and 4 round down to Nov 1 (100 + 150); Nov 8, 9 and 14 to Nov 8 (90 + 120 + 60); Nov 15 stays (200).", "d": 3}, {"id": "sample27", "topic": "sample", "type": "open", "prompt": "Goal: a column chart with month_start on x; count on y; bar interiors colored by kind so the two kinds stack in each month; x tick labels reading Sep and Oct; y labels with commas; colors from kind_colors. Write the ggplot2 code, starting with month_df |>, using at most seven function calls (counting aes() and the labelling function).", "code": "month_df\nmonth_start  kind  count\n2026-09-01   Bus   500\n2026-09-01   Rail  300\n2026-10-01   Bus   640\n2026-10-01   Rail  410\n\nkind_colors <- c(Bus = \"darkgreen\", Rail = \"orange\")", "ans": "month_df |>\n  ggplot(aes(x = month_start, y = count, fill = kind)) +\n  geom_col() +\n  scale_x_date(date_breaks = \"1 month\", date_labels = \"%b\") +\n  scale_y_continuous(labels = label_comma()) +\n  scale_fill_manual(values = kind_colors)", "exp": "Bar interiors are fill, so fill = kind and scale_fill_manual(). %b is the short month name. Seven calls: ggplot, aes, geom_col, scale_x_date, scale_y_continuous, label_comma, scale_fill_manual.", "d": 3}, {"id": "sample28", "topic": "sample", "type": "open", "prompt": "Describe or sketch the plot. Include, labelled: (a) the color of each route's line and its three (hour, riders) points in order; (b) whether the lines cross and between which hours; (c) where the legend is and its title; (d) the text of the y-axis tick label at 3000.", "code": "hour_df\nhour  route  riders\n8     Pine   800\n12    Pine   2100\n16    Pine   1700\n8     Oak    600\n12    Oak    1500\n16    Oak    2200\n\nroute_colors <- c(Pine = \"darkgreen\", Oak = \"orange\")\n\nhour_df |>\n  ggplot(aes(x = hour, y = riders, color = route)) +\n  geom_line() +\n  geom_point() +\n  scale_color_manual(values = route_colors) +\n  scale_y_continuous(labels = label_comma()) +\n  labs(x = \"Hour (24h)\", y = \"Riders\", color = \"Route\") +\n  theme(legend.position = \"bottom\")", "ans": "(a) Pine is darkgreen: (8, 800), (12, 2100), (16, 1700). Oak is orange: (8, 600), (12, 1500), (16, 2200).\n(b) They cross between hour 12 and hour 16 (Pine is above at 8 and 12, below at 16).\n(c) The legend is at the bottom, titled \"Route\".\n(d) \"3,000\".", "exp": "Compare the two lines at each hour: Pine - Oak is +200, +600, -500, so the sign flips between 12 and 16. label_comma() puts the comma in.", "d": 3}, {"id": "sample29", "topic": "sample", "type": "open", "prompt": "Each problem below applies to the code. Write the fix for each and explain in one sentence. (a) The lines come out gray instead of green and orange. (b) The x tick labels read 09 and 10 instead of Sep and Oct. (c) The y ticks read 50,000% and 64,000%.", "code": "kind_colors <- c(bus = \"darkgreen\", rail = \"orange\")\n\nmonth_df |>\n  ggplot(aes(x = month_start, y = count, color = kind)) +\n  geom_line() +\n  geom_point() +\n  scale_color_manual(values = kind_colors) +\n  scale_x_date(date_breaks = \"1 month\", date_labels = \"%m\") +\n  scale_y_continuous(labels = label_percent())", "ans": "(a) The named vector's names (bus, rail) do not match the levels in the data (Bus, Rail). Names must match exactly (case included): c(Bus = \"darkgreen\", Rail = \"orange\").\n(b) date_labels = \"%m\" prints the month number. Use date_labels = \"%b\".\n(c) label_percent() multiplies by 100 and adds %, which is for proportions. For counts use labels = label_comma().", "exp": "Unmatched names get the NA color (gray) silently; the other two are format-code and label-function choices.", "d": 3}, {"id": "sample30", "topic": "sample", "type": "open", "prompt": "team_df is shown (weekday is an ordered factor from wday(label = TRUE)). (a) Write one line saving team_df as team_summary.csv inside Data/. (b) The file is read back with read_csv(): dimensions? (c) The type of weekday after reading back, and why. (d) R is restarted: is the file still on disk, and is team_df still in the environment?", "code": "team_df\nweekday  mean_pts\nMon      72.5\nWed      64.0\nSat      69.5", "ans": "(a) write_csv(team_df, \"Data/team_summary.csv\")\n(b) 3 x 2.\n(c) character (<chr>): a CSV is plain text and cannot store factor levels.\n(d) The file is still on disk; team_df is gone (the environment is cleared on restart).", "exp": "Files persist on disk; objects live in memory.", "d": 3}, {"id": "sample31", "topic": "sample", "type": "open", "prompt": "A student runs left_join(teams_df, titles_df, by = \"year\") and R prints a warning. (a) Dimensions of that result and why the rows match incorrectly. (b) The correct call. (c) Dimensions of the correct result and the rows where title is NA.", "code": "teams_df              titles_df\nteam  year  wins      team  year  title\nA     2024  10        A     2025  Champion\nB     2024  12        B     2024  Champion\nA     2025  14        C     2025  Champion\nB     2025  9", "ans": "(a) 6 x 5 (team.x, year, wins, team.y, title). year is not a unique key: in 2025 each of the two teams_df rows matches both 2025 titles_df rows (4 rows), in 2024 each matches the one 2024 row (2 rows). Titles attach to the wrong teams.\n(b) left_join(teams_df, titles_df, by = c(\"team\", \"year\"))\n(c) 4 x 4 (team, year, wins, title). title is NA for team A in 2024 and team B in 2025.", "exp": "Two keys together identify one team-season. A shared column name that is not in by= gets .x/.y suffixes.", "d": 3}, {"id": "sample32", "topic": "sample", "type": "open", "prompt": "In two sentences: what is the difference between fct_recode() and fct_collapse(), and what happens if you give fct_recode() the arguments backwards (old = \"new\")?", "code": null, "ans": "fct_recode() renames levels (new = \"old\") and keeps the same number of categories; fct_collapse() groups several levels into one name and reduces the number. If the names are backwards, fct_recode() looks for an old level that does not exist: it gives a warning (not an error) and changes nothing.", "exp": "Direction is always new = old.", "d": 3}];
const TOPICS = {
  verbs:"Verbs, pipes, errors", na:"Missing values", str:"stringr", fct:"Factors (forcats)",
  gg:"ggplot grammar", scale:"Scales, date axes, export", join:"Binds and joins",
  date:"lubridate", tz:"Time zones and Lab 8", found:"Foundations review", facts:"Course data facts",
  sample:"ME2 sample style: write, read, fix"
};
const MOCK_QUOTA = {verbs:2, na:1, str:1, fct:2, gg:2, scale:2, join:3, date:2, tz:1, sample:2};
const KEY = "me2_drill_bank_v1";
let prog = {};
try { prog = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e) { prog = {}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(prog)); } catch(e) {} }
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const byId = Object.fromEntries(BANK.map(q => [q.id, q]));

let mode = "practice";
let sel = new Set(Object.keys(TOPICS));
let S = null; // session

function stats(){
  const ids = Object.keys(prog);
  const answered = ids.length;
  const right = ids.filter(i => prog[i].last).length;
  $("#stats").innerHTML = `<span><b>${BANK.length}</b> questions</span><span><b>${answered}</b> answered</span><span><b>${answered?Math.round(100*right/answered):0}%</b> last answer right</span>`;
  const t = $("#topics"); t.innerHTML = "";
  for (const k of Object.keys(TOPICS)){
    const qs = BANK.filter(q => q.topic===k);
    const done = qs.filter(q => prog[q.id] && prog[q.id].last).length;
    const row = document.createElement("div"); row.className = "topic";
    row.innerHTML = `<input type="checkbox" id="c-${k}" ${sel.has(k)?"checked":""}><label for="c-${k}">${TOPICS[k]}</label><span class="n">${done}/${qs.length}</span><div class="bar"><i style="width:${100*done/qs.length}%"></i></div>`;
    t.appendChild(row);
    row.querySelector("input").onchange = e => { e.target.checked ? sel.add(k) : sel.delete(k); };
  }
}

function pool(){
  const seen = $("#f-seen").value, hard = $("#f-d").value==="3";
  let qs = BANK.filter(q => sel.has(q.topic));
  if (mode==="missed") qs = qs.filter(q => prog[q.id] && !prog[q.id].last);
  if (seen==="new") qs = qs.filter(q => !prog[q.id]);
  if (seen==="wrong") qs = qs.filter(q => prog[q.id] && !prog[q.id].last);
  if (hard) qs = qs.filter(q => q.d>=3);
  return qs;
}

function home(){
  $("#main").innerHTML = `<div class="card home"><h2>Pick topics, then start</h2>
  <p>${BANK.length} questions on weeks 1 to 8 of STAT/DATA 1810, built from the notes, labs, check-ins and the real ME1.</p>
  <p><b>Practice</b>: shuffled questions with instant feedback and an explanation. <b>Mock exam</b>: 18 mixed questions (no write-it-out ones), 70 minutes, no feedback until you finish. <b>Missed</b>: only questions you last got wrong.</p>
  <p>Question types: multiple choice, select all that apply, dimensions (rows x columns), numbers, and write-it-out questions you self-grade against a model answer (the style of the real sample exam). For code questions, work it out by hand before you click.</p>
  <p class="hint">Keys: <kbd>1</kbd>-<kbd>5</kbd> pick an option, <kbd>Enter</kbd> check or next. Progress is saved in this browser only. Everything runs offline.</p>
  <p><button class="btn" id="go">Start</button></p></div>`;
  $("#go").onclick = start;
}

function start(){
  let qs;
  if (mode==="mock"){
    qs = [];
    for (const [t,n] of Object.entries(MOCK_QUOTA)){
      qs.push(...shuffle(BANK.filter(q => q.topic===t && q.type!=="open")).slice(0,n));
    }
    qs = shuffle(qs);
  } else {
    qs = shuffle(pool());
  }
  if (!qs.length){ $("#main").innerHTML = `<div class="card"><p>No questions match these filters.</p></div>`; return; }
  document.querySelector('aside').classList.remove('open'); $('#tp-toggle').setAttribute('aria-expanded','false');
  S = { mode, ids: qs.map(q=>q.id), i:0, ans:{}, t0:Date.now(), limit:70*60, over:false, done:false, session:{right:0,total:0} };
  if (mode==="mock") { S.timer = setInterval(tick, 1000); }
  render(); window.scrollTo(0,0);
}

function tick(){
  if (!S || S.mode!=="mock" || S.done) return;
  const left = Math.max(0, S.limit - Math.floor((Date.now()-S.t0)/1000));
  const el = document.getElementById("timer");
  if (el){ el.textContent = fmt(left); el.classList.toggle("low", left<300); }
  if (left===0) finish();
}
const fmt = s => String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");

function qView(q, st){
  // st: {order, picked(set), vals, checked, correct}
  let h = `<div class="meta"><span class="tag">${esc(TOPICS[q.topic])}</span><span class="tag">${q.id}</span>` +
    (q.type==="multi" ? `<span class="tag">select all that apply</span>` : q.type==="dims" ? `<span class="tag">rows x columns</span>` : q.type==="num" ? `<span class="tag">number</span>` : q.type==="open" ? `<span class="tag">write it, then self-grade</span>` : "") + `</div>`;
  h += `<p class="prompt">${esc(q.prompt)}</p>`;
  if (q.code) h += `<pre class="code"><code>${esc(q.code)}</code></pre>`;
  if (q.type==="mc" || q.type==="multi"){
    h += `<div class="opts" role="${q.type==="mc"?"radiogroup":"group"}">`;
    st.order.forEach((oi, pos) => {
      let cls = "opt";
      if (st.picked.has(oi)) cls += " sel";
      if (st.checked){
        const isAns = q.type==="mc" ? oi===q.ans : q.ans.includes(oi);
        if (isAns && st.picked.has(oi)) cls = "opt good";
        else if (isAns) cls = "opt miss";
        else if (st.picked.has(oi)) cls = "opt bad";
      }
      h += `<button type="button" class="${cls}" data-oi="${oi}" ${st.checked?"disabled":""}><span class="k">${"ABCDEF"[pos]}</span><span class="t">${esc(q.opts[oi])}</span></button>`;
    });
    h += `</div>`;
  } else if (q.type==="dims"){
    h += `<div class="inputs"><label>rows<input id="v0" inputmode="numeric" autocomplete="off" value="${esc(st.vals[0]||"")}" ${st.checked?"disabled":""}></label><span class="x">x</span><label>columns<input id="v1" inputmode="numeric" autocomplete="off" value="${esc(st.vals[1]||"")}" ${st.checked?"disabled":""}></label></div>`;
  } else if (q.type==="open"){
    h += `<textarea class="try" id="v0" placeholder="Work it out here (optional), then reveal the model answer." ${st.revealed?"disabled":""}>${esc(st.vals[0]||"")}</textarea>`;
  } else {
    h += `<div class="inputs"><label>your answer<input id="v0" inputmode="decimal" autocomplete="off" value="${esc(st.vals[0]||"")}" ${st.checked?"disabled":""}></label></div>`;
  }
  return h;
}

function isCorrect(q, st){
  if (q.type==="open") return st.correct===true;
  if (q.type==="mc") return st.picked.size===1 && st.picked.has(q.ans);
  if (q.type==="multi"){ const a = new Set(q.ans); return a.size===st.picked.size && [...a].every(x => st.picked.has(x)); }
  const num = v => parseFloat(String(v).replace(/,/g,"").trim());
  if (q.type==="dims") return num(st.vals[0])===q.ans[0] && num(st.vals[1])===q.ans[1];
  const v = num(st.vals[0]); return isFinite(v) && Math.abs(v-q.ans) <= (q.tol||1e-9);
}
function ansText(q){
  if (q.type==="open") return q.ans;
  if (q.type==="mc") return q.opts[q.ans];
  if (q.type==="multi") return q.ans.map(i=>q.opts[i]).join("  |  ");
  if (q.type==="dims") return q.ans[0].toLocaleString()+" x "+q.ans[1].toLocaleString();
  return q.ans.toLocaleString();
}

function stateFor(q){
  if (!S.ans[q.id]) {
    const n = (q.opts||[]).length;
    S.ans[q.id] = { order: q.opts ? shuffle([...Array(n).keys()]) : [], picked:new Set(), vals:["",""], checked:false, correct:null, saved:false };
  }
  return S.ans[q.id];
}

function render(){
  if (!S) return home();
  const q = byId[S.ids[S.i]], st = stateFor(q), mock = S.mode==="mock";
  const left = mock ? Math.max(0, S.limit - Math.floor((Date.now()-S.t0)/1000)) : 0;
  let h = `<div class="card">`;
  h += `<div class="meta"><span>Question <b>${S.i+1}</b> of ${S.ids.length}</span>` + (mock ? `<span>Time left <span class="timer ${left<300?"low":""}" id="timer">${fmt(left)}</span></span>` : `<span>Session: ${S.session.right}/${S.session.total} right</span>`) + `</div>`;
  if (mock){
    h += `<div class="grid">` + S.ids.map((id,i)=>`<button data-j="${i}" class="${i===S.i?"cur":""} ${S.ans[id]&&S.ans[id].saved?"done":""}" aria-label="Question ${i+1}">${i+1}</button>`).join("") + `</div>`;
  }
  h += qView(q, st);
  h += `<div class="row actions">`;
  if (mock){
    h += `<button class="btn alt" id="prev" ${S.i===0?"disabled":""}>Back</button><button class="btn" id="nextm">${S.i===S.ids.length-1?"Save":"Save and next"}</button><button class="btn alt" id="fin">Finish exam</button>`;
  } else if (q.type==="open" && st.revealed && !st.checked){
    h += `<button class="btn" id="g1">I had it</button><button class="btn alt" id="g0">I missed it</button>`;
  } else if (!st.checked){
    h += `<button class="btn" id="check">${q.type==="open"?"Reveal answer":"Check"}</button><button class="btn alt" id="skip">Skip</button>`;
  } else {
    h += `<button class="btn" id="next">${S.i===S.ids.length-1?"See summary":"Next"}</button>`;
  }
  h += `</div>`;
  if (!mock && q.type==="open" && st.revealed){
    const cls = st.checked ? (st.correct ? "" : "no") : "neutral";
    h += `<div class="fb ${cls}" role="status"><b class="v">${st.checked ? (st.correct ? "Marked as got it" : "Marked as missed") : "Model answer"}</b><pre class="ans">${esc(q.ans)}</pre><p>${esc(q.exp)}</p></div>`;
  } else if (!mock && st.checked){
    h += `<div class="fb ${st.correct?"":"no"}" role="status"><b class="v">${st.correct?"Correct":"Not quite"}</b><p>${st.correct?"":"Answer: "+esc(ansText(q))+"\n\n"}${esc(q.exp)}</p></div>`;
  }
  h += `</div>`;
  $("#main").innerHTML = h;
  wire(q, st);
  const first = document.getElementById("v0"); if (first && !st.checked) first.focus();
}

function wire(q, st){
  const mock = S.mode==="mock";
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (st.checked) return;
    const oi = +b.dataset.oi;
    if (q.type==="mc"){ st.picked = new Set([oi]); }
    else { st.picked.has(oi) ? st.picked.delete(oi) : st.picked.add(oi); }
    document.querySelectorAll(".opt").forEach(x => x.classList.toggle("sel", st.picked.has(+x.dataset.oi)));
  });
  ["v0","v1"].forEach((id,i)=>{ const el=document.getElementById(id); if(el) el.oninput = () => { st.vals[i]=el.value; }; });
  const on = (id, f) => { const el = document.getElementById(id); if (el) el.onclick = f; };
  on("check", () => check(q, st));
  on("g1", () => grade(q, st, true));
  on("g0", () => grade(q, st, false));
  on("skip", () => { goto(S.i+1); });
  on("next", () => goto(S.i+1));
  on("prev", () => { commit(q, st); goto(S.i-1); });
  on("nextm", () => { commit(q, st); if (S.i<S.ids.length-1) goto(S.i+1); else render(); });
  on("fin", () => { commit(q, st); if (confirm("Finish the exam now?")) finish(); });
  document.querySelectorAll(".grid button").forEach(b => b.onclick = () => { commit(q, st); goto(+b.dataset.j); });
}
function answered(q, st){
  if (q.type==="open") return true;
  if (q.type==="mc"||q.type==="multi") return st.picked.size>0;
  if (q.type==="dims") return st.vals[0].trim()!=="" && st.vals[1].trim()!=="";
  return st.vals[0].trim()!=="";
}
function commit(q, st){ st.saved = answered(q, st); }
function grade(q, st, ok){
  st.checked = true; st.correct = ok;
  const p = prog[q.id] || {r:0,w:0}; ok ? p.r++ : p.w++; p.last = ok; prog[q.id] = p; save();
  S.session.total++; if (ok) S.session.right++;
  stats(); render();
  const fb = document.querySelector('.fb'); if (fb) fb.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function check(q, st){
  if (q.type==="open"){ st.revealed = true; render(); const fb = document.querySelector('.fb'); if (fb) fb.scrollIntoView({block:'nearest',behavior:'smooth'}); return; }
  if (!answered(q, st)) { alert("Enter an answer first."); return; }
  st.checked = true; st.correct = isCorrect(q, st);
  const p = prog[q.id] || {r:0,w:0};
  st.correct ? p.r++ : p.w++; p.last = st.correct; prog[q.id] = p; save();
  S.session.total++; if (st.correct) S.session.right++;
  stats(); render();
  const fb = document.querySelector('.fb'); if (fb) fb.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function goto(i){
  if (i<0) return;
  if (i>=S.ids.length){ if (S.mode==="mock") { render(); return; } return summary(); }
  S.i = i; render(); window.scrollTo(0,0);
}
function summary(){
  const t = S.session.total, r = S.session.right;
  $("#main").innerHTML = `<div class="card res"><h2>Session done</h2><p>${r} of ${t} right${t?` (${Math.round(100*r/t)}%)`:""}.</p><p><button class="btn" id="again">New round</button> <button class="btn alt" id="hm">Back</button></p></div>`;
  $("#again").onclick = start; $("#hm").onclick = () => { S=null; home(); };
}
function finish(){
  if (!S || S.done) return; S.done = true; clearInterval(S.timer);
  const rows = {}; let right=0; const missed=[];
  S.ids.forEach(id => {
    const q = byId[id], st = S.ans[id];
    const ok = st && answered(q, st) && isCorrect(q, st);
    const t = rows[q.topic] || (rows[q.topic]={r:0,n:0}); t.n++; if (ok) { t.r++; right++; }
    const p = prog[id] || {r:0,w:0}; ok ? p.r++ : p.w++; p.last = ok; prog[id] = p;
    if (!ok) missed.push(q);
  });
  save(); stats();
  const used = Math.min(S.limit, Math.floor((Date.now()-S.t0)/1000));
  let h = `<div class="card res"><h2>Mock exam result</h2><p><b>${right} / ${S.ids.length}</b> (${Math.round(100*right/S.ids.length)}%) in ${fmt(used)}.</p>`;
  h += `<table><tr><th>Topic</th><th>Right</th></tr>` + Object.entries(rows).map(([k,v])=>`<tr><td>${esc(TOPICS[k])}</td><td>${v.r} / ${v.n}</td></tr>`).join("") + `</table>`;
  if (missed.length){ h += `<h3>Review what you missed</h3>`;
    missed.forEach(q => { h += `<div class="miss-item"><div class="meta"><span class="tag">${esc(TOPICS[q.topic])}</span><span class="tag">${q.id}</span></div><p class="prompt">${esc(q.prompt)}</p>${q.code?`<pre class="code"><code>${esc(q.code)}</code></pre>`:""}<div class="fb no"><p>Answer: ${esc(ansText(q))}\n\n${esc(q.exp)}</p></div></div>`; });
  }
  h += `<p><button class="btn" id="again">New mock exam</button> <button class="btn alt" id="hm">Back</button></p></div>`;
  $("#main").innerHTML = h;
  $("#again").onclick = start; $("#hm").onclick = () => { S=null; home(); };
}

// mode buttons
function setMode(m){
  mode = m;
  if (S && S.timer) clearInterval(S.timer);
  S = null;
  ["practice","mock","missed"].forEach(x => $("#m-"+x).setAttribute("aria-pressed", x===m));
  if (m==="mock" || true) home();
}
$("#m-practice").onclick = () => setMode("practice");
$("#m-mock").onclick = () => { setMode("mock"); };
$("#m-missed").onclick = () => setMode("missed");
$("#t-all").onclick = () => { sel = new Set(Object.keys(TOPICS)); stats(); };
$("#t-none").onclick = () => { sel = new Set(); stats(); };
$("#reset").onclick = () => { if (confirm("Erase saved progress?")) { prog = {}; save(); stats(); } };

document.addEventListener("keydown", e => {
  if (!S || S.mode==="mock" && S.done) return;
  const q = byId[S.ids[S.i]]; if (!q) return;
  const st = stateFor(q);
  const tag = (document.activeElement||{}).tagName;
  if (tag==="TEXTAREA") return;
  if (e.key==="Enter" && S.mode!=="mock"){
    e.preventDefault();
    if (st.checked) goto(S.i+1); else if (q.type==="open" && st.revealed) return; else check(q, st);
  } else if (e.key==="Enter" && S.mode==="mock" && tag==="INPUT"){
    e.preventDefault(); commit(q, st); if (S.i<S.ids.length-1) goto(S.i+1);
  } else if (/^[1-6]$/.test(e.key) && tag!=="INPUT" && !st.checked && st.order.length){
    const pos = +e.key-1; if (pos<st.order.length){ const oi = st.order[pos];
      if (q.type==="mc") st.picked = new Set([oi]); else st.picked.has(oi)?st.picked.delete(oi):st.picked.add(oi);
      document.querySelectorAll(".opt").forEach(x => x.classList.toggle("sel", st.picked.has(+x.dataset.oi))); }
  }
});

$("#tp-toggle").onclick = () => { const a = document.querySelector('aside'); const o = a.classList.toggle('open'); $("#tp-toggle").setAttribute('aria-expanded', o); };
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) { navigator.serviceWorker.register('./sw.js').catch(() => {}); }
stats(); home();
</script>
